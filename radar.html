<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار الزوايا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@700;900&display=swap">
<style>
  /* غرفة رادار: الزاوية هدف يجب اعتراضه بثلاث قرارات: الاتجاه، الزاوية المكافئة، مكان ضلع الانتهاء */
  :root {
    --deep: #031726; --panel: #072a3b; --edge: #145a6e; --radar: #38e8c4; --arm: #ffb020; --spiral: #ff8a3d;
    --paper: #fbf6ee; --ink: #1b2742; --muted: #5d6b84; --orange: #f07a2a; --gold: #ffc247;
    --good: #22c55e; --good-soft: #dcfce7; --bad: #ef4444; --bad-soft: #fee2e2;
    --f-ar: "Cairo", "Segoe UI", Tahoma, sans-serif; --f-m: "STIX Two Text", "Cambria Math", "Times New Roman", serif; --f-led: "Orbitron", "Cairo", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; font-family: var(--f-ar); color: #fff; direction: rtl; background: radial-gradient(ellipse at 50% -10%, #0b4a63, var(--deep) 60%) fixed;
    padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .m { font-family: var(--f-m); direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-size: 1.08em; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--orange); }
  .who b { display: block; font-size: 16px; font-weight: 900; } .who span { font-size: 12px; color: var(--gold); font-weight: 800; }
  #sound { margin-inline-start: auto; font: inherit; font-size: 13px; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 20px; padding: 4px 12px; cursor: pointer; }
  .hud { display: flex; align-items: center; gap: 10px; background: #0007; border: 1px solid #ffffff22; border-radius: 14px; padding: 8px 12px; flex-wrap: wrap; }
  .shields { font-size: 20px; letter-spacing: 2px; } .shields .off { filter: grayscale(1); opacity: 0.25; }
  .score { font-family: var(--f-led); color: var(--gold); font-size: 16px; direction: ltr; }
  .ms { display: flex; gap: 5px; margin-inline-start: auto; }
  .mc { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; background: #ffffff14; color: #9fe9d8; border: 2px solid transparent; }
  .mc.now { border-color: var(--gold); color: #fff; } .mc.done { background: var(--good); color: #fff; } .mc.lost { background: var(--bad); color: #fff; }
  .timer { height: 8px; border-radius: 6px; background: #ffffff1a; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold), var(--radar)); transform-origin: right; }

  .scope { position: relative; background: var(--panel); border: 2px solid var(--edge); border-radius: 22px; padding: 10px; }
  .scope svg { width: 100%; max-width: 440px; display: block; margin: 0 auto; touch-action: manipulation; }
  .target { position: absolute; top: 12px; right: 14px; background: #000a; border: 2px solid var(--radar); border-radius: 14px; padding: 4px 12px; text-align: center; }
  .target small { display: block; font-size: 11px; color: #9fe9d8; font-weight: 800; }
  .target b { font-family: var(--f-m); font-size: 30px; color: var(--arm); direction: ltr; display: block; }
  .odo { position: absolute; top: 12px; left: 14px; background: #000a; border: 2px solid #ffffff33; border-radius: 14px; padding: 4px 12px; text-align: center; }
  .odo small { display: block; font-size: 11px; color: #9fe9d8; font-weight: 800; } .odo b { font-family: var(--f-m); font-size: 22px; direction: ltr; display: block; }
  .zone { fill: #38e8c400; cursor: default; transition: fill 0.2s; }
  .pick .zone { cursor: pointer; } .pick .zone:hover, .pick .zone:focus { fill: #38e8c433; outline: none; }
  .axz { stroke: #38e8c400; stroke-width: 34; stroke-linecap: round; transition: stroke 0.2s; }
  .pick .axz { cursor: pointer; } .pick .axz:hover, .pick .axz:focus { stroke: #ffd24a55; outline: none; }
  .zone.ok { fill: #22c55e55; } .zone.bad { fill: #ef444466; } .axz.ok { stroke: #22c55e88; } .axz.bad { stroke: #ef444488; }
  .qlab { font: 800 13px var(--f-ar); fill: #ffffff55; direction: rtl; unicode-bidi: plaintext; pointer-events: none; }
  .tk { font: 600 13px var(--f-m); fill: #38e8c4aa; direction: ltr; unicode-bidi: bidi-override; pointer-events: none; }
  .ax { font: italic 18px var(--f-m); fill: #cfe9f2; pointer-events: none; }
  .boom { font-size: 40px; pointer-events: none; }

  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: up 0.3s ease; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .card h2 { margin: 0; font-size: 19px; font-weight: 900; } .card p { margin: 0; line-height: 1.85; font-size: 15.5px; }
  .card h1 { margin: 0; font-size: 28px; font-weight: 900; color: #0b4a63; }
  .steps { display: flex; gap: 6px; } .st { flex: 1; text-align: center; font-size: 12.5px; font-weight: 900; padding: 4px; border-radius: 10px; background: #e8eef5; color: var(--muted); }
  .st.now { background: var(--orange); color: #fff; } .st.ok { background: var(--good); color: #fff; } .st.bad { background: var(--bad); color: #fff; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { font: inherit; font-size: 17px; font-weight: 900; padding: 14px 8px; border-radius: 14px; border: 2px solid #c9d6e6; background: #fff; color: var(--ink); cursor: pointer; transition: transform 0.12s; }
  .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--orange); }
  .opt:disabled { cursor: default; opacity: 0.6; } .opt.ok { background: var(--good-soft); border-color: var(--good); opacity: 1; } .opt.bad { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }
  .opt .m { font-size: 22px; }
  .big { font-size: 34px; display: block; }
  .fb { border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.8; font-weight: 700; }
  .fb.ok { background: var(--good-soft); color: #14532d; } .fb.bad { background: var(--bad-soft); color: #7f1d1d; }
  .go { font: inherit; font-size: 18px; font-weight: 900; color: #fff; background: var(--orange); border: 0; border-radius: 16px; padding: 12px 20px; cursor: pointer; box-shadow: 0 6px 0 #b9581a; }
  .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #b9581a; }
  ol.how { margin: 0; padding-inline-start: 22px; line-height: 1.9; font-size: 15.5px; }
  .warn { background: #fff4e5; border: 2px dashed var(--orange); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14.5px; line-height: 1.8; }
  .stars { font-size: 44px; text-align: center; letter-spacing: 6px; } .stars .off { filter: grayscale(1); opacity: 0.25; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; } .tbl td { padding: 6px; border-bottom: 1px solid #e3e8ef; }
  footer { text-align: center; font-size: 12px; color: #9fc6e6; padding-top: 6px; }
  .shake { animation: shk 0.35s 2; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .card, .shake { animation: none; } }
</style>
</head>

  <div class="scope">
    <svg id="rad" viewBox="0 0 400 400" role="img" aria-label="شاشة الرادار"></svg>
    <div class="target"><small>الهدف</small><b id="tgt">—</b></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const m = (t) => `<span class="m">${t}</span>`;
  const deg = (a) => (a < 0 ? '−' + -a : '' + a) + '°';
  const C = 200, R = 160;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let store = null; try { store = window.localStorage; } catch (e) {}
  const getRec = () => { try { return +(store && store.getItem('albunyan-radar-rec')) || 0; } catch (e) { return 0; } };
  const setRec = (v) => { try { store && store.setItem('albunyan-radar-rec', String(v)); } catch (e) {} };

  // ——— الصوت ———
  let ac = null, soundOn = true;
  const beep = (f, d = 0.12, type = 'sine', v = 0.15, at = 0) => {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  };
  const S = {
    ping: () => { beep(1320, 0.25, 'sine', 0.12); beep(1320, 0.35, 'sine', 0.05, 0.25); },
    ok: () => { beep(660, 0.1, 'triangle'); beep(990, 0.16, 'triangle', 0.15, 0.09); },
    bad: () => { beep(180, 0.3, 'sawtooth', 0.12); beep(140, 0.3, 'sawtooth', 0.1, 0.12); },
    tick: () => beep(900, 0.03, 'square', 0.04),
    lap: () => beep(520, 0.08, 'triangle', 0.1),
    win: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.22, 'triangle', 0.15, i * 0.12)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.28, 'sawtooth', 0.09, i * 0.16)),
  };
  $('#sound').onclick = (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 الصوت'; e.currentTarget.setAttribute('aria-pressed', soundOn); };

  // ——— الرادار ———
  // زاوية رياضية a (موجبة = عكس عقارب الساعة) ⇐ نقطة على الشاشة
  const P = (a, r) => [C + r * Math.cos(a * Math.PI / 180), C - r * Math.sin(a * Math.PI / 180)];
  const ZONES = [
    { id: 'Q1', ar: 'داخل الربع الأول', q: true, a: 45 }, { id: 'Q2', ar: 'داخل الربع الثاني', q: true, a: 135 },
    { id: 'Q3', ar: 'داخل الربع الثالث', q: true, a: 225 }, { id: 'Q4', ar: 'داخل الربع الرابع', q: true, a: 315 },
    { id: 'A0', ar: 'على محور x الموجب', a: 0 }, { id: 'A90', ar: 'على محور y الموجب', a: 90 },
    { id: 'A180', ar: 'على محور x السالب', a: 180 }, { id: 'A270', ar: 'على محور y السالب', a: 270 },
  ];
  const zoneOf = (c) => (c % 90 === 0 ? 'A' + c : 'Q' + (Math.floor(c / 90) + 1));
  const drawRadar = () => {
    let s = `<defs><radialGradient id="rg"><stop offset="0" stop-color="#0c3b46"/><stop offset="1" stop-color="#061f2c"/></radialGradient></defs>`;
    s += `<circle cx="${C}" cy="${C}" r="${R}" fill="url(#rg)" stroke="#38e8c4" stroke-width="3"/>`;
    [55, 110].forEach((r) => (s += `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="#38e8c444" stroke-width="1.5"/>`));
    for (let d = 0; d < 360; d += 30) { const [x1, y1] = P(d, R - (d % 90 ? 8 : 14)), [x2, y2] = P(d, R); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#38e8c499" stroke-width="2"/>`; }
    s += `<g id="zones">`;
    ZONES.filter((z) => z.q).forEach((z) => { const [x0, y0] = P(z.a - 45, R), [x1, y1] = P(z.a + 45, R); s += `<path class="zone" data-z="${z.id}" tabindex="-1" role="button" aria-label="${z.ar}" d="M${C} ${C} L${x0} ${y0} A${R} ${R} 0 0 0 ${x1} ${y1} Z"/>`; });
    s += `</g>`;
    s += `<line x1="${C - R - 18}" y1="${C}" x2="${C + R + 18}" y2="${C}" stroke="#cfe9f2" stroke-width="2"/><line x1="${C}" y1="${C + R + 18}" x2="${C}" y2="${C - R - 18}" stroke="#cfe9f2" stroke-width="2"/>`;
    s += `<text class="ax" x="${C + R + 14}" y="${C + 22}">x</text><text class="ax" x="${C + 8}" y="${C - R - 6}">y</text>`;
    [['الربع الأول', 45], ['الربع الثاني', 135], ['الربع الثالث', 225], ['الربع الرابع', 315]].forEach(([t, a]) => { const [x, y] = P(a, 105); s += `<text class="qlab" x="${x}" y="${y}" text-anchor="middle">${t}</text>`; });
    s += `<g id="axz">`;
    ZONES.filter((z) => !z.q).forEach((z) => { const [x0, y0] = P(z.a, 22), [x1, y1] = P(z.a, R - 6); s += `<line class="axz" data-z="${z.id}" tabindex="-1" role="button" aria-label="${z.ar}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; });
    s += `</g>`;
    s += `<line x1="${C}" y1="${C}" x2="${C + R}" y2="${C}" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" pointer-events="none"/>`;
    s += `<path id="spiral" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" pointer-events="none"/>`;
    s += `<g id="arm" pointer-events="none"><line x1="${C}" y1="${C}" x2="${C + R - 12}" y2="${C}" stroke="#ffb020" stroke-width="6" stroke-linecap="round"/><path d="M${C + R + 2} ${C} l-20 -10 v20 Z" fill="#ffb020"/></g>`;
    s += `<circle cx="${C}" cy="${C}" r="8" fill="#fff" stroke="#ff8a3d" stroke-width="4" pointer-events="none"/>`;
    s += `<text id="boom" class="boom" x="0" y="0" text-anchor="middle" opacity="0">💥</text>`;
    $('#rad').innerHTML = s;
  };
  const setArm = (a) => { $('#arm').setAttribute('transform', `rotate(${-a} ${C} ${C})`); $('#odo').textContent = deg(Math.round(a)); };
  const spiralTo = (a) => {
    if (!a) return $('#spiral').setAttribute('d', '');
    const n = Math.max(2, Math.ceil(Math.abs(a) / 4)); let d = '';
    for (let i = 0; i <= n; i++) { const t = (a * i) / n, r = 26 + Math.abs(t) / 360 * 24; const [x, y] = P(t, r); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
    $('#spiral').setAttribute('d', d);
  };
  let spinT = null;
  const spin = (to, done) => {
    clearInterval(spinT);
    if (reduce) { setArm(to); spiralTo(to); return done && done(); }
    const speed = 540, dur = Math.max(0.6, Math.abs(to) / speed) * 1000, t0 = performance.now(); let lap = 0;
    spinT = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / dur), a = to * k;
      setArm(a); spiralTo(a);
      const nl = Math.floor(Math.abs(a) / 360); if (nl > lap) { lap = nl; S.lap(); }
      if (k >= 1) { clearInterval(spinT); done && done(); }
    }, 16);
  };
  const boom = (a) => { const [x, y] = P(a, R - 20); const b = $('#boom'); b.setAttribute('x', x); b.setAttribute('y', y + 12); b.setAttribute('opacity', 1); setTimeout(() => b.setAttribute('opacity', 0), 900); };

  // ——— المراحل ———
  const STAGES = [
    { name: 'تدريب', list: [-90, 210, -135] },
    { name: 'أكثر من دورة', list: [450, -450, -600] },
    { name: 'الهدف الكبير', list: [-900, 990, -1230] },
  ];
  const ALL = STAGES.flatMap((s, i) => s.list.map((a) => ({ a, st: i })));
  const coterm = (a) => ((a % 360) + 360) % 360;
  const TIME = 35;
  let idx = 0, shields = 3, score = 0, step = 0, timer = null, left = TIME, mist = { dir: 0, cot: 0, loc: 0 }, res = [];

  const hud = () => {
    $('#shields').innerHTML = [0, 1, 2].map((i) => `<span class="${i < shields ? '' : 'off'}">🛡️</span>`).join('');
    $('#score').textContent = score;
    $('#ms').innerHTML = ALL.map((_, i) => `<span class="mc ${res[i] === 1 ? 'done' : res[i] === 0 ? 'lost' : i === idx ? 'now' : ''}">${i + 1}</span>`).join('');
  };
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const startTimer = () => {
    stopTimer(); left = TIME; $('#tbar').style.transform = 'scaleX(1)';
    timer = setInterval(() => {
      left -= 0.1; $('#tbar').style.transform = `scaleX(${Math.max(0, left / TIME)})`;
      if (left <= 8 && Math.abs(left - Math.round(left)) < 0.05) S.tick();
      if (left <= 0) { stopTimer(); timeout(); }
    }, 100);
  };
  const lose1 = () => { shields--; hud(); $('.scope').classList.remove('shake'); void $('.scope').offsetWidth; $('.scope').classList.add('shake'); };

  const g = $('#game');
  const stepsBar = () => `<div class="steps">${['① الاتجاه', '② الزاوية المكافئة', '③ ضلع الانتهاء'].map((t, i) => `<span class="st ${i < step ? 'ok' : i === step ? 'now' : ''}">${t}</span>`).join('')}</div>`;

  const intro = () => {
    stopTimer(); drawRadar(); setArm(0); spiralTo(0); $('#tgt').textContent = '—';
    idx = 0; shields = 3; score = 0; res = []; mist = { dir: 0, cot: 0, loc: 0 }; hud();
    const rec = getRec();
    g.innerHTML = `<div class="card"><h1>📡 رادار الزوايا</h1>
      <p>أنت ضابط الرادار. ستظهر لك زوايا تريد أن ترسمها في <b>الوضع القياسي</b>: الرأس في نقطة الأصل، والضلع الابتدائي على محور ${m('<i>x</i>')} الموجب. لكل زاوية ثلاثة قرارات، ثم يدور الذراع ليعترض الهدف.</p>
      <h2>كيف تلعب؟</h2>
      <ol class="how"><li><b>الاتجاه:</b> هل يدور الذراع مع عقارب الساعة ↻ أم عكسها ↺؟</li>
      <li><b>الزاوية المكافئة:</b> اختر الزاوية بين ${m('0°')} و${m('360°')} التي لها ضلع الانتهاء نفسه.</li>
      <li><b>ضلع الانتهاء:</b> اضغط على الرادار: داخل أحد الأرباع الأربعة، أو على أحد المحاور.</li></ol>
      <div class="warn">⚠️ يمكنك أن تخسر! معك ${m('3')} دروع 🛡️. كل قرار خاطئ أو انتهاء الوقت (${m(TIME + ' ث')}) يكلّفك درعًا، وإذا نفدت الدروع انتهت المهمة.</div>
      <p>تسعة أهداف في ثلاث مراحل: <b>تدريب</b> ← <b>أكثر من دورة</b> ← <b>الهدف الكبير</b>. ${rec ? `أفضل نتيجة لك: <b class="m">${rec}</b>` : ''}</p>
      <button class="go" id="start">ابدأ المهمة 🚀</button></div>`;
    $('#start').onclick = () => { S.ping(); next(); };
  };

  const next = () => {
    if (idx >= ALL.length) return end(true);
    step = 0; hud(); drawRadar(); setArm(0); spiralTo(0);
    const t = ALL[idx]; $('#tgt').textContent = deg(t.a); S.ping();
    if (idx === 0 || ALL[idx - 1].st !== t.st) {
      g.innerHTML = `<div class="card" style="text-align:center"><h2>المرحلة ${t.st + 1}: ${STAGES[t.st].name}</h2><p>${t.st === 0 ? 'زوايا لا تتجاوز دورة واحدة.' : t.st === 1 ? 'الآن أكثر من دورة: احسب الدورات الكاملة أولًا.' : 'زوايا ضخمة، منها زاوية الفيديو!'}</p><button class="go" id="gost">جاهز ✔</button></div>`;
      $('#gost').onclick = () => { askDir(); };
    } else askDir();
  };

  const card = (title, body) => { g.innerHTML = `<div class="card">${stepsBar()}<h2>${title}</h2>${body}</div>`; };

  const askDir = () => {
    const a = ALL[idx].a; step = 0; startTimer();
    card(`الهدف ${m(deg(a))}: في أي اتجاه يدور الذراع؟`, `<div class="opts"><button class="opt" data-v="cw"><span class="big">↻</span>مع عقارب الساعة</button><button class="opt" data-v="ccw"><span class="big">↺</span>عكس عقارب الساعة</button></div><div id="fb"></div>`);
    g.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      stopTimer(); g.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
      const ok = (b.dataset.v === 'cw') === a < 0;
      const right = g.querySelector(`.opt[data-v="${a < 0 ? 'cw' : 'ccw'}"]`); right.classList.add('ok');
      if (ok) { S.ok(); score += 100; hud(); $('#fb').innerHTML = `<div class="fb ok">✓ ${a < 0 ? 'الزاوية سالبة، فالدوران مع عقارب الساعة.' : 'الزاوية موجبة، فالدوران عكس عقارب الساعة.'}</div>`; setTimeout(askCot, 900); }
      else { S.bad(); b.classList.add('bad'); mist.dir++; lose1(); $('#fb').innerHTML = `<div class="fb bad">✗ الإشارة هي التي تحدد الاتجاه: <b>الموجبة ↺ عكس عقارب الساعة</b>، و<b>السالبة ↻ مع عقارب الساعة</b>. هنا ${m(deg(a))} ${a < 0 ? 'سالبة' : 'موجبة'}.</div><button class="go" id="cont">تابع</button>`; if (shields <= 0) return setTimeout(() => end(false), 1400); $('#cont').onclick = askCot; }
    }));
  };

  const cotOpts = (a) => {
    const c = coterm(a), set = [c], add = (v) => { v = ((v % 360) + 360) % 360; if (!set.includes(v)) set.push(v); };
    add(Math.abs(a) % 360); add(360 - (Math.abs(a) % 360)); add(c + 180); add(c + 90); add(c + 270);
    const o = set.slice(0, 4); for (let i = o.length - 1; i > 0; i--) { const j = (i * 7 + idx * 3) % (i + 1); [o[i], o[j]] = [o[j], o[i]]; }
    return o;
  };
  const why = (a) => {
    const c = coterm(a), k = Math.round((c - a) / 360);
    return k === 0 ? `${m(deg(a))} بين ${m('0°')} و${m('360°')} أصلًا.` : `${m(`${deg(a)} ${k > 0 ? '+' : '−'} ${Math.abs(k)}(360°) = ${deg(c)}`)}`;
  };
  const askCot = () => {
    const a = ALL[idx].a; step = 1; startTimer();
    const c = coterm(a);
    card(`ما الزاوية المكافئة لـ ${m(deg(a))} بين ${m('0°')} و${m('360°')}؟`, `<p style="font-size:14px;color:#5d6b84">تلميح: ${a < 0 ? 'أضف' : 'اطرح'} ${m('360°')} حتى تصل إلى زاوية بين ${m('0°')} و${m('360°')}.</p><div class="opts">${cotOpts(a).map((v) => `<button class="opt" data-v="${v}">${m(v + '°')}</button>`).join('')}</div><div id="fb"></div>`);
    g.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      stopTimer(); g.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
      g.querySelector(`.opt[data-v="${c}"]`).classList.add('ok');
      const v = +b.dataset.v;
      if (v === c) { S.ok(); score += 100; hud(); $('#fb').innerHTML = `<div class="fb ok">✓ ${why(a)}</div>`; setTimeout(askLoc, 1100); }
      else {
        S.bad(); b.classList.add('bad'); mist.cot++; lose1();
        let tip = '';
        if (a < 0 && v === Math.abs(a) % 360) tip = 'أهملتَ الإشارة السالبة: حسبتَ الباقي من دون أن تنتبه أن الدوران مع عقارب الساعة.';
        else if (v === (c + 180) % 360) tip = 'هذه عكس الاتجاه الصحيح تمامًا (فرق نصف دورة).';
        else tip = 'الدورة الكاملة ' + m('360°') + ' لا تغيّر ضلع الانتهاء، فأضف أو اطرح دورات كاملة فقط.';
        $('#fb').innerHTML = `<div class="fb bad">✗ ${tip}<br>الصحيح: ${why(a)}</div><button class="go" id="cont">تابع</button>`;
        if (shields <= 0) return setTimeout(() => end(false), 1600);
        $('#cont').onclick = askLoc;
      }
    }));
  };

  const askLoc = () => {
    const a = ALL[idx].a, c = coterm(a), want = zoneOf(c); step = 2; startTimer();
    card(`أين يقف ضلع الانتهاء للزاوية ${m(deg(a))}؟`, `<p>👆 اضغط على الرادار في الأعلى: <b>داخل ربع</b>، أو <b>على أحد المحاور</b> (الخطوط).</p><div id="fb"></div>`);
    const svg = $('#rad'); svg.classList.add('pick');
    const els = svg.querySelectorAll('[data-z]');
    els.forEach((el) => { el.setAttribute('tabindex', '0'); el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.onclick(); } }; });
    $('.scope').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    els.forEach((el) => (el.onclick = () => {
      stopTimer(); svg.classList.remove('pick'); els.forEach((x) => { x.onclick = null; x.setAttribute('tabindex', '-1'); });
      const ok = el.dataset.z === want;
      svg.querySelector(`[data-z="${want}"]`).classList.add('ok');
      if (!ok) el.classList.add('bad');
      spin(a, () => {
        g.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
        const zn = ZONES.find((z) => z.id === want).ar;
        if (ok) { S.ok(); boom(c); score += 100 + Math.round(left * 4); res[idx] = 1; hud(); $('#fb').innerHTML = `<div class="fb ok">🎯 تم الاعتراض! ضلع الانتهاء ${zn}، تمامًا مثل ${m(c + '°')}.</div><button class="go" id="cont">الهدف التالي ⟵</button>`; }
        else { S.bad(); mist.loc++; res[idx] = 0; lose1(); $('#fb').innerHTML = `<div class="fb bad">✗ شاهد الذراع: يقف ضلع الانتهاء ${zn}، لأن الزاوية المكافئة ${m(c + '°')}${c % 90 === 0 ? ' تقع على محور، فالزاوية <b>ربعية</b> وليست داخل ربع' : ''}.</div><button class="go" id="cont">تابع ⟵</button>`; if (shields <= 0) return setTimeout(() => end(false), 1600); }
        $('#cont').onclick = () => { idx++; next(); };
      });
    }));
  };

  const timeout = () => {
    S.bad(); lose1(); mist[['dir', 'cot', 'loc'][step]]++;
    $('#rad').classList.remove('pick');
    g.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
    const fb = $('#fb'); if (fb) fb.innerHTML = `<div class="fb bad">⏰ انتهى الوقت! خسرت درعًا.</div><button class="go" id="cont">تابع</button>`;
    if (shields <= 0) return setTimeout(() => end(false), 1200);
    $('#cont').onclick = () => { if (step === 0) askCot(); else if (step === 1) askLoc(); else { res[idx] = 0; idx++; next(); } };
  };

  const end = (won) => {
    stopTimer(); hud(); $('#rad').classList.remove('pick');
    const st = won ? Math.max(1, shields) : 0;
    const rec = getRec(), isRec = score > rec; if (isRec) setRec(score);
    won ? S.win() : S.lose();
    const tips = [];
    if (mist.dir) tips.push(`<tr><td>↻ الاتجاه</td><td>${m(mist.dir)}</td><td>السالبة مع عقارب الساعة، والموجبة عكسها.</td></tr>`);
    if (mist.cot) tips.push(`<tr><td>🔁 الزاوية المكافئة</td><td>${m(mist.cot)}</td><td>أضف أو اطرح ${m('360°')} فقط، ولا تُهمل الإشارة.</td></tr>`);
    if (mist.loc) tips.push(`<tr><td>📍 ضلع الانتهاء</td><td>${m(mist.loc)}</td><td>إذا كانت المكافئة من مضاعفات ${m('90°')} فالضلع على محور.</td></tr>`);
    g.innerHTML = `<div class="card" style="text-align:center"><h1>${won ? '🏆 أنجزت المهمة!' : '💥 نفدت الدروع'}</h1>
      <div class="stars">${[0, 1, 2].map((i) => `<span class="${i < st ? '' : 'off'}">⭐</span>`).join('')}</div>
      <p>النقاط: <b class="m">${score}</b> ${isRec ? '· 🎉 رقم قياسي جديد!' : rec ? `· أفضل نتيجة: <b class="m">${rec}</b>` : ''}</p>
      ${won ? '' : '<p>لا بأس! راجع الأخطاء في الأسفل ثم حاول مرة أخرى.</p>'}
      ${tips.length ? `<table class="tbl" style="text-align:right"><tr><td><b>نوع الخطأ</b></td><td><b>العدد</b></td><td><b>تذكّر</b></td></tr>${tips.join('')}</table>` : '<p>✨ بلا أي خطأ في الفهم!</p>'}
      <div class="fb ok" style="text-align:right">📌 زاوية الفيديو: ${m('−900°')} = دورتان ونصف مع عقارب الساعة ⇐ تكافئ ${m('180°')} ⇐ ضلع الانتهاء على محور ${m('<i>x</i>')} السالب.</div>
      <button class="go" id="again">العب مرة أخرى 🔁</button></div>`;
    $('#again').onclick = intro;
  };

  intro();
})();
</script>
</body>
</html>

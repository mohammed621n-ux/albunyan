<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركلات الترجيح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@700;900&display=swap">
<style>
  /* ملعب ليلي تحت الأضواء: لوحة نتائج إلكترونية، مرمى وحارس، وشاشة إعادة لحل الطالب */
  :root {
    --night: #050b14; --grass: #0f5132; --grass-2: #126b3f; --chalk: #ffffffd9;
    --screen: #07101d; --panel: #0d1a2c; --edge: #23395a;
    --paper: #fbf6ee; --ink: #1b2742; --muted: #6b7a93;
    --orange: #f07a2a; --gold: #ffc247; --good: #22c55e; --good-soft: #dcfce7; --bad: #ef4444; --bad-soft: #fee2e2;
    --led: #ffb020; --blue: #2563eb;
    --f-ar: "Cairo", "Segoe UI", Tahoma, sans-serif;
    --f-m: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
    --f-led: "Orbitron", "Cairo", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; font-family: var(--f-ar); color: #fff; direction: rtl;
    background: radial-gradient(ellipse at 50% -10%, #1d3a5f 0%, var(--night) 55%) fixed;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    padding-block: 14px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .m { font-family: var(--f-m); direction: ltr; unicode-bidi: isolate; font-size: 1.1em; }
  .m i { font-style: italic; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--orange); flex: none; }
  .who b { display: block; font-size: 16px; font-weight: 900; } .who span { font-size: 12px; color: var(--gold); font-weight: 800; }
  #sound { margin-inline-start: auto; font: inherit; font-size: 13px; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 20px; padding: 4px 12px; cursor: pointer; }

  /* لوحة النتائج */
  .board { background: #000; border: 3px solid #2b2b2b; border-radius: 16px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; box-shadow: 0 0 0 4px #111, 0 10px 30px #000a; }
  .team { text-align: center; font-weight: 900; font-size: 14px; color: #cbd5e1; }
  .team .sc { display: block; font-family: var(--f-led); font-size: 46px; color: var(--led); text-shadow: 0 0 12px #ffb02099; line-height: 1.05; }
  .team.them .sc { color: #f87171; text-shadow: 0 0 12px #f8717199; }
  .mid { text-align: center; }
  .clock { font-family: var(--f-led); font-size: 26px; color: #fff; letter-spacing: 2px; }
  .clock.low { color: var(--bad); animation: blink 0.5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .kicks { display: flex; gap: 5px; justify-content: center; margin-top: 4px; }
  .kick { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #475569; }
  .kick.g { background: var(--good); border-color: var(--good); } .kick.s { background: var(--bad); border-color: var(--bad); } .kick.n { border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .streak { font-size: 13px; color: var(--gold); font-weight: 900; min-height: 18px; }

  /* الملعب */
  .pitch { position: relative; height: 210px; border-radius: 18px; overflow: hidden; background: repeating-linear-gradient(180deg, var(--grass) 0 26px, var(--grass-2) 26px 52px); box-shadow: inset 0 -40px 60px #0006; }
  .pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ball { transition: transform 0.75s cubic-bezier(.2,.9,.3,1); }
  #keeper { transition: transform 0.45s cubic-bezier(.3,1.4,.5,1); transform-origin: 300px 120px; }
  #net.shake { animation: net 0.5s ease; }
  @keyframes net { 25% { transform: translateY(-5px); } 50% { transform: translateY(4px); } 75% { transform: translateY(-2px); } }
  .shout { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: clamp(48px, 14vw, 84px); pointer-events: none; opacity: 0; text-shadow: 0 6px 0 #0008; }
  .shout.on { animation: shout 1.3s ease forwards; }
  .shout.goal { color: var(--gold); } .shout.save { color: #fca5a5; }
  @keyframes shout { 0% { opacity: 0; transform: scale(0.4) rotate(-8deg); } 25% { opacity: 1; transform: scale(1.15) rotate(3deg); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: fl 0.5s ease; } @keyframes fl { 0% { opacity: 0.7; } 100% { opacity: 0; } }

  /* شاشة الإعادة */
  .screen { background: var(--screen); border: 3px solid var(--edge); border-radius: 18px; padding: 14px; position: relative; overflow: hidden; }
  .screen::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #ffffff06 0 2px, transparent 2px 5px); pointer-events: none; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .rtag { background: #ef4444; color: #fff; font-weight: 900; font-size: 13px; border-radius: 8px; padding: 1px 10px; animation: blink 1s steps(2) infinite; }
  .slow { font-family: var(--f-led); color: var(--gold); font-size: 12px; letter-spacing: 2px; direction: ltr; }
  .tbar { flex: 1; height: 8px; border-radius: 4px; background: #1e293b; overflow: hidden; }
  .tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), var(--gold), var(--bad)); transform-origin: right; }
  .qbox { background: var(--panel); border-radius: 12px; padding: 10px 12px; line-height: 1.95; font-size: 15.5px; color: #dbe6f7; }
  .qbox .m { color: #ffd27a; }
  .hint2 { margin: 10px 0 6px; font-size: 14px; color: #93a4bf; font-weight: 800; }
  .lines { display: flex; flex-direction: column; gap: 8px; }
  .ln { font: inherit; display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; background: #0f1d33; border: 2px solid var(--edge); border-radius: 13px; padding: 9px 11px; color: #fff; cursor: pointer; transition: border-color 0.15s, transform 0.15s, background 0.15s; }
  .ln:hover:not([disabled]) { border-color: var(--gold); transform: scale(1.015); background: #13264a; }
  .ln .k { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--edge); display: grid; place-items: center; font-weight: 900; font-size: 13px; }
  .ln .m { font-size: 20px; overflow-wrap: anywhere; }
  .ln.bad { border-color: var(--bad); background: #3b1111; } .ln.bad .k { background: var(--bad); }
  .ln.fine { border-color: #166534; } .ln.mine { box-shadow: 0 0 0 3px var(--gold); }
  .ln[disabled] { cursor: default; }
  .allok { font: inherit; font-weight: 900; font-size: 15px; margin-top: 8px; width: 100%; border-radius: 13px; border: 2px dashed #16a34a; background: #052e16; color: #86efac; padding: 11px; cursor: pointer; }
  .allok.mine { box-shadow: 0 0 0 3px var(--gold); }
  .ln:focus-visible, .allok:focus-visible, .rb:focus-visible, .btn:focus-visible, #sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: up 0.35s ease; }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } }
  .card h2 { margin: 0; font-size: 19px; font-weight: 900; } .card p { margin: 0; line-height: 1.85; font-size: 15.5px; }
  .card .m { color: var(--blue); }
  .bonus { display: inline-block; background: var(--gold); color: #3b2a00; font-weight: 900; border-radius: 8px; padding: 0 8px; font-size: 13px; }
  .reasons { display: grid; gap: 8px; }
  .rb { font: inherit; font-size: 15px; text-align: start; border-radius: 12px; border: 2px solid #cfd8e8; background: #fff; color: var(--ink); padding: 9px 12px; cursor: pointer; line-height: 1.7; }
  .rb.ok { border-color: var(--good); background: var(--good-soft); } .rb.no { border-color: var(--bad); background: var(--bad-soft); }
  .rb[disabled] { cursor: default; }
  .fb { border-radius: 12px; padding: 9px 12px; line-height: 1.85; font-size: 15px; }
  .fb.ok { background: var(--good-soft); border-inline-start: 5px solid var(--good); } .fb.no { background: var(--bad-soft); border-inline-start: 5px solid var(--bad); }
  .btn { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer; background: var(--orange); color: #fff; box-shadow: 0 4px 0 #b9581a; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9581a; }
  .btn.big { font-size: 20px; padding: 16px 30px; }

  .intro { text-align: center; padding: 18px 14px; background: linear-gradient(180deg, #0d1a2c, #07101d); border: 2px solid var(--edge); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .intro h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); font-weight: 900; line-height: 1.1; }
  .intro h1 em { font-style: normal; color: var(--gold); }
  .intro p { margin: 0; color: #c7d2e3; line-height: 1.8; font-size: 15.5px; max-width: 34em; }
  .rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .rules div { background: #0f1d33; border-radius: 12px; padding: 10px 6px; font-size: 13px; font-weight: 800; color: #cbd5e1; line-height: 1.6; }
  .rules b { display: block; font-size: 24px; }
  .law { background: #052e16; border: 2px solid #166534; border-radius: 14px; padding: 10px 12px; color: #d1fae5; line-height: 1.85; font-size: 14.5px; text-align: start; width: 100%; }
  .law b { color: var(--gold); }
  .end { text-align: center; align-items: center; }
  .cup { font-size: 84px; line-height: 1; animation: cup 1.2s ease; } @keyframes cup { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.2) rotate(8deg); } }
  .final { font-family: var(--f-led); font-size: 44px; color: var(--ink); }
  .best { font-size: 14px; color: var(--muted); }
  .conf { position: fixed; top: -14px; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .shake { animation: shk 0.4s; } @keyframes shk { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  footer { text-align: center; color: #7d8ca5; font-size: 12.5px; }
  @media (max-width: 420px) { .rules div { font-size: 12px; } .team .sc { font-size: 38px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>

      why: [['أخطأ في القسمة: 8 ÷ 2 = 3', 0], ['نسي العدد 2 الموجود مع مربع k خارج المطلق: الصواب m = 4 + 2 = 6', 1], ['الرأس عند أكبر قيمة للاقتران', 0]],
      fix: m(`${M} = ${K}${s2} + 2 = 4 + 2 = 6`) },
    { q: `رأس منحنى ${m(`<i>f</i>(${X}) = 2|${X} − 3${K}| + (${K}${s2} − 1)`)} هو ${m(`(6 , ${M})`)}، حيث ${m(`${K} &gt; 0`)}. أوجد ${m(M)}.`,
      L: [`${X} − 3${K} = 0 ⇒ ${X} = 3${K}`, `3${K} = 6 ⇒ ${K} = 2`, `${M} = 2(${K}${s2} − 1) = 6`], bad: 3,
      why: [['كان يجب أن تكون k = 3', 0], ['نسي أن يربّع k', 0], ['ضرب في العدد 2 قبل المطلق، وهذا العدد يغيّر اتساع الحرف V فقط ولا يغيّر الرأس', 1]],
      fix: m(`${M} = ${K}${s2} − 1 = 4 − 1 = 3`) },
    { q: `رأس منحنى ${m(`<i>f</i>(${X}) = |4${X} − 12${K}| + (${K}${s2} + 5)`)} هو ${m(`(6 , ${M})`)}، حيث ${m(`${K} &gt; 0`)}. أوجد ${m(M)}.`,
      L: [`4${X} = 12${K}`, `${X} = 4${K}`, `4${K} = 6 ⇒ ${K} = 1.5`, `${M} = 2.25 + 5 = 7.25`], bad: 2,
      why: [['أخطأ في القسمة: 12 ÷ 4 = 3، فالصواب x = 3k', 1], ['السطر الأول خطأ: داخل المطلق لا يساوي صفرًا', 0], ['كان يجب أن يجمع 12 و 4', 0]],
      fix: m(`${X} = 3${K} ⇒ 3${K} = 6 ⇒ ${K} = 2 ⇒ ${M} = 4 + 5 = 9`) },
    { q: `رأس منحنى ${m(`<i>f</i>(${X}) = 5|2${X} − 6${K}| + (${K}${s2} + 3)`)} هو ${m(`(9 , ${M})`)}، حيث ${m(`${K} &gt; 0`)}. أوجد ${m(M)}.`,
      L: [`2${X} − 6${K} = 0 ⇒ ${X} = 3${K}`, `3${K} = 9 ⇒ ${K} = 3`, `${M} = 3${s2} + 3 = 12`], bad: 0,
      why: [['يجب ضرب m في 5', 0], ['كل الخطوات صحيحة: داخل المطلق = 0، ثم k = 3، ثم m = 9 + 3 = 12', 1], ['k = 9 لا 3', 0]],
      fix: `${m(`${M} = 12`)}، والعدد 5 لا يغيّر الرأس.` },
    { q: `رأس منحنى ${m(`<i>f</i>(${X}) = 2|${X} − 2${K}| + (${K}${s2} + 1)`)} هو ${m(`(${H} , 10)`)}، حيث ${m(`${K} &gt; 0`)}. أوجد ${m(H)}.`,
      L: [`${K}${s2} + 1 = 10 ⇒ ${K}${s2} = 9`, `${K} = 3 &nbsp;or&nbsp; ${K} = −3`, `${H} = 2${K} = ±6`], bad: 3,
      why: [['k² = 9 تعطي k = 4.5', 0], ['الصادي يجب أن يساوي 2k', 0], ['أهمل الشرط k > 0، فالقيمة k = −3 مرفوضة، و h = 6 فقط', 1]],
      fix: m(`${K} &gt; 0 ⇒ ${K} = 3 ⇒ ${H} = 6`) },
    { q: `رأس منحنى ${m(`<i>f</i>(${X}) = |3${X} − 6${K}| + (${K} + 1)${s2}`)} هو ${m(`(4 , ${M})`)}، حيث ${m(`${K} &gt; 0`)}. أوجد ${m(M)}.`,
      L: [`3${X} = 6${K} ⇒ ${X} = 2${K}`, `2${K} = 4 ⇒ ${K} = 2`, `${M} = ${K}${s2} + 1 = 5`], bad: 3,
      why: [['انتبه للأقواس: العدد خارج المطلق هنا (k + 1)²، فالصواب (2 + 1)² = 9', 1], ['k = 4 لا 2', 0], ['m = 2k = 4', 0]],
      fix: m(`${M} = (${K} + 1)${s2} = 3${s2} = 9`) },
  ];
  const SHOT = 30;
  let i = 0, you = 0, them = 0, streak = 0, best = 0, kicks = [], timer = null, left = SHOT, locked = false;

  // الأصوات
  let ac = null, soundOn = true;
  const ctx = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
  const tone = (seq, type = 'triangle', vol = 0.1) => { if (!soundOn) return; try { const a = ctx(); let t = a.currentTime; seq.forEach(([f, d]) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d); t += d * 0.85; }); } catch (e) {} };
  const crowd = (dur = 1.6, vol = 0.22) => { if (!soundOn) return; try { const a = ctx(), n = a.sampleRate * dur, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let k = 0; k < n; k++) d[k] = Math.random() * 2 - 1; const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.setValueAtTime(0.001, a.currentTime); g.gain.exponentialRampToValueAtTime(vol, a.currentTime + 0.25); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur); s.connect(f).connect(g).connect(a.destination); s.start(); } catch (e) {} };
  const whistle = () => tone([[2300, 0.08], [2700, 0.08], [2300, 0.08], [2700, 0.2]], 'square', 0.06);
  const kickS = () => tone([[120, 0.12]], 'sine', 0.3);
  const tick = () => tone([[1500, 0.04]], 'square', 0.03);
  const groan = () => tone([[260, 0.25], [200, 0.4]], 'sawtooth', 0.07);
  const ding = () => tone([[880, 0.1], [1320, 0.2]]);
  $('#sound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 بلا صوت'; e.currentTarget.setAttribute('aria-pressed', soundOn); });

  const confetti = (n = 80) => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols = ['#ffc247', '#22c55e', '#f07a2a', '#ffffff', '#60a5fa'];
    for (let k = 0; k < n; k++) { const d = document.createElement('div'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[k % cols.length]; d.style.animationDuration = 1.5 + Math.random() * 1.7 + 's'; d.style.animationDelay = Math.random() * 0.3 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 3800); }
  };
  const drawBoard = () => {
    $('#sYou').textContent = you; $('#sThem').textContent = them;
    $('#kicks').innerHTML = R.map((_, k) => `<span class="kick ${kicks[k] === 'g' ? 'g' : kicks[k] === 's' ? 's' : k === i ? 'n' : ''}"></span>`).join('');
    $('#streak').textContent = streak >= 2 ? `🔥 ${streak} أهداف متتالية` : '';
  };
  const setClock = () => { const c = $('#clock'); c.textContent = '00:' + String(left).padStart(2, '0'); c.classList.toggle('low', left <= 8); const b = $('.tbar i'); if (b) b.style.transform = `scaleX(${left / SHOT})`; };
  const resetPitch = () => { $('#ball').style.transform = ''; $('#keeper').style.transform = ''; };
  const shout = (txt, cls) => { const s = $('#shout'); s.className = 'shout'; void s.offsetWidth; s.textContent = txt; s.className = 'shout on ' + cls; };
  // الركلة: هدف أم صدّ
  const shoot = (goal) => {
    kickS();
    const side = Math.random() < 0.5 ? -1 : 1;
    const bx = side * (110 + Math.random() * 40), by = -120 - Math.random() * 30;
    $('#ball').style.transform = `translate(${goal ? bx : side * 60}px, ${goal ? by : -95}px) scale(0.7)`;
    $('#keeper').style.transform = goal ? `translateX(${-side * 70}px) rotate(${-side * 60}deg)` : `translateX(${side * 60}px) rotate(${side * 55}deg)`;
    setTimeout(() => {
      if (goal) { $('#net').classList.remove('shake'); void $('#net').offsetWidth; $('#net').classList.add('shake'); const f = $('#flash'); f.className = 'flash'; void f.offsetWidth; f.className = 'flash on'; shout('هدف!', 'goal'); crowd(1.8); confetti(40); }
      else { shout('صدّها!', 'save'); groan(); $('#pitch').classList.remove('shake'); void $('#pitch').offsetWidth; $('#pitch').classList.add('shake'); }
    }, 500);
  };

  const stopTimer = () => { clearInterval(timer); timer = null; };
  const startTimer = (onOut) => { stopTimer(); left = SHOT; setClock(); timer = setInterval(() => { left--; setClock(); if (left <= 5 && left > 0) tick(); if (left <= 0) { stopTimer(); onOut(); } }, 1000); };

  const intro = () => {
    $('#game').innerHTML = `<div class="intro">
      <h1>ركلات <em>الترجيح</em> ⚽</h1>
      <p>المباراة: <b>أنت ضد الأخطاء</b>. في كل ركلة يظهر حل طالب على شاشة الإعادة. اكشف السطر الخاطئ، أو احكم بأن الحل صحيح كله، قبل انتهاء ${SHOT} ثانية.</p>
      <div class="rules"><div><b>⚽</b>قرار صحيح = هدف لك</div><div><b>🧤</b>قرار خاطئ أو انتهاء الوقت = صدّ، ونقطة للأخطاء</div><div><b>⭐</b>سبب صحيح = نقطة إضافية</div></div>
      <div class="law"><b>📌 قانون الرأس:</b> السيني للرأس: <b>ما داخل المطلق = 0</b>. والصادي: <b>العدد خارج المطلق</b>. والعدد قبل المطلق لا يغيّر الرأس.</div>
      <button type="button" class="btn big" id="go">🏁 ابدأ المباراة</button></div>`;
    $('#go').addEventListener('click', () => { whistle(); crowd(1.0, 0.12); round(); });
  };

  const round = () => {
    locked = false; resetPitch(); drawBoard();
    const r = R[i];
    $('#game').innerHTML = `<div class="screen" id="scr">
        <div class="bar"><span class="rtag">⏪ إعادة</span><span class="slow">SLOW 0.5×</span><div class="tbar"><i></i></div><span style="font-size:13px;color:#93a4bf;font-weight:800">الركلة ${i + 1}/${R.length}</span></div>
        <div class="qbox">${r.q}</div>
        <div class="hint2">حل الطالب: أين الخطأ؟</div>
        <div class="lines">${r.L.map((l, k) => `<button type="button" class="ln" data-k="${k + 1}"><span class="k">${k + 1}</span><span class="m">${l}</span></button>`).join('')}</div>
        <button type="button" class="allok" id="allok">✓ الحل صحيح كله</button></div><div id="after"></div>`;
    const decide = (pick, el) => {
      if (locked) return; locked = true; stopTimer();
      document.querySelectorAll('.ln, .allok').forEach((b) => (b.disabled = true));
      if (el) el.classList.add('mine');
      if (r.bad) document.querySelector(`.ln[data-k="${r.bad}"]`).classList.add('bad');
      document.querySelectorAll('.ln').forEach((b) => { if (+b.dataset.k !== r.bad) b.classList.add('fine'); });
      const right = pick === r.bad;
      kicks[i] = right ? 'g' : 's';
      if (right) { you++; streak++; best = Math.max(best, streak); } else { them++; streak = 0; }
      shoot(right); setTimeout(drawBoard, 600);
      const A = $('#after');
      A.innerHTML = `<div class="card"><h2>${right ? '⚽ هدف! قرار صحيح' : pick === -1 ? '⏱ انتهى الوقت: صدّها الحارس' : '🧤 صدّها الحارس'}</h2>
        <p>${r.bad ? `الخطأ في <b>السطر ${r.bad}</b> (الملوّن بالأحمر).` : 'لا يوجد خطأ: الحل صحيح كله.'}</p>
        <p><span class="bonus">⭐ نقطة إضافية</span> لماذا؟ اختر السبب:</p><div class="reasons" id="rs"></div><div id="rf"></div></div>`;
      const rs = $('#rs'), rf = $('#rf');
      r.why.forEach(([t, good]) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'rb'; b.textContent = t;
        b.addEventListener('click', () => {
          rs.querySelectorAll('.rb').forEach((x) => { x.disabled = true; if (r.why.find((w) => w[0] === x.textContent)[1]) x.classList.add('ok'); });
          if (good) { you++; ding(); rf.className = 'fb ok'; rf.innerHTML = `<b>⭐ +1.</b> الصواب: ${r.fix}`; }
          else { b.classList.add('no'); groan(); rf.className = 'fb no'; rf.innerHTML = `<b>السبب الصحيح بالأخضر.</b> الصواب: ${r.fix}`; }
          drawBoard();
          const n = document.createElement('button'); n.type = 'button'; n.className = 'btn'; n.textContent = i + 1 < R.length ? 'الركلة التالية ⚽' : 'صافرة النهاية 🏁';
          n.addEventListener('click', () => { i++; if (i < R.length) { whistle(); round(); } else finish(); $('.board').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
          rf.after(n); n.focus({ preventScroll: true });
        });
        rs.appendChild(b);
      });
      setTimeout(() => A.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 700);
    };
    document.querySelectorAll('.ln').forEach((b) => b.addEventListener('click', () => decide(+b.dataset.k, b)));
    $('#allok').addEventListener('click', (e) => decide(0, e.currentTarget));
    startTimer(() => decide(-1, null));
  };

  const finish = () => {
    stopTimer(); drawBoard(); $('#clock').textContent = 'FT';
    const max = R.length * 2;
    const rank = you >= 11 ? ['🏆', 'حكم دولي!'] : you >= 8 ? ['🥇', 'نجم المباراة'] : you >= 5 ? ['🥈', 'لاعب واعد'] : ['💪', 'جرّب مرة أخرى، ستفوز'];
    let rec = 0; try { rec = +localStorage.getItem('bunyan-penalties') || 0; if (you > rec) localStorage.setItem('bunyan-penalties', you); } catch (e) {}
    const won = you > them;
    $('#game').innerHTML = `<div class="card end"><div class="cup">${rank[0]}</div><h2>${won ? 'فزت على الأخطاء!' : 'انتهت المباراة'}</h2>
      <div class="final">${you} – ${them}</div><p><b>${rank[1]}</b> · من ${max} نقطة · أطول سلسلة أهداف: ${best} 🔥</p>
      <p class="best">${you > rec ? '🎉 رقم قياسي جديد على هذا الجهاز!' : `رقمك القياسي: ${rec}`}</p>
      <p style="text-align:start"><b>الأخطاء التي واجهتها:</b> نسيان العدد خارج المطلق، الضرب في العدد قبل المطلق، القسمة الخاطئة، إهمال الشرط ${m(`${K} &gt; 0`)}، وقراءة الأقواس.</p>
      <p>📸 صوّر نتيجتك وشاركها في التعليقات!</p>
      <button type="button" class="btn big" id="again">↺ مباراة جديدة</button></div>`;
    whistle(); setTimeout(() => { crowd(2.2, 0.25); if (won) confetti(120); }, 400);
    $('#again').addEventListener('click', () => { i = 0; you = 0; them = 0; streak = 0; best = 0; kicks = []; whistle(); round(); });
  };

  drawBoard(); intro();
})();
</script>

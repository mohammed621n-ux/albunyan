<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوّاب النادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@700;900&display=swap">
<style>
  /* باب نادٍ ليلي بلافتة نيون، حبل مخملي، وضيوف أرقام ينتظرون الدخول */
  :root {
    --night: #0b0716; --wall: #1a1030; --wall-2: #24163f; --edge: #3b2766;
    --neon: #ff3cac; --neon-2: #39d0ff; --gold: #ffc247; --orange: #f07a2a;
    --paper: #fbf6ee; --ink: #1b2742; --muted: #6b7a93;
    --good: #22c55e; --good-soft: #dcfce7; --bad: #ef4444; --bad-soft: #fee2e2; --blue: #2563eb;
    --f-ar: "Cairo", "Segoe UI", Tahoma, sans-serif; --f-m: "STIX Two Text", "Cambria Math", "Times New Roman", serif; --f-led: "Orbitron", "Cairo", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; font-family: var(--f-ar); color: #fff; direction: rtl; background: radial-gradient(ellipse at 50% -10%, #3a1a5c, var(--night) 60%) fixed;
    padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .m { font-family: var(--f-m); direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-size: 1.1em; }
  .m i { font-style: italic; }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05; margin: 0 3px; } .fr .den { border-top: 2px solid currentColor; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--orange); }
  .who b { display: block; font-size: 16px; font-weight: 900; } .who span { font-size: 12px; color: var(--gold); font-weight: 800; }
  #sound { margin-inline-start: auto; font: inherit; font-size: 13px; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 20px; padding: 4px 12px; cursor: pointer; }

  .hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: #000a; border: 1px solid #ffffff22; border-radius: 14px; padding: 8px 12px; }
  .hearts { font-size: 20px; letter-spacing: 2px; } .hearts .off { filter: grayscale(1); opacity: 0.25; }
  .score { font-family: var(--f-led); color: var(--gold); font-size: 24px; text-align: center; text-shadow: 0 0 10px #ffc24788; }
  .combo { font-size: 13px; font-weight: 900; color: var(--neon); min-width: 64px; text-align: left; }
  .lvls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .lv { text-align: center; border-radius: 10px; padding: 5px 2px; font-size: 12px; font-weight: 900; background: #ffffff10; color: #b9a7e6; border: 1px solid #ffffff1a; }
  .lv.now { background: #ff3cac33; border-color: var(--neon); color: #fff; } .lv.done { background: #22c55e2a; border-color: var(--good); color: #c9f5da; }

  .club { position: relative; height: 250px; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, var(--wall-2), var(--wall)); border: 2px solid var(--edge); }
  .sign { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 24px; color: #fff; padding: 2px 18px 6px; border: 3px solid var(--neon); border-radius: 14px; text-shadow: 0 0 8px var(--neon), 0 0 18px var(--neon); box-shadow: 0 0 14px var(--neon), inset 0 0 10px #ff3cac66; white-space: nowrap; animation: flick 3s infinite; }
  @keyframes flick { 92% { opacity: 1; } 94% { opacity: 0.4; } 96% { opacity: 1; } }
  .door { position: absolute; left: 22px; bottom: 0; width: 120px; height: 170px; border-radius: 60px 60px 0 0; background: linear-gradient(180deg, #2b1a4f, #120a24); border: 4px solid #6c4bb5; box-shadow: inset 0 0 30px #000; }
  .door.open { background: linear-gradient(180deg, #ffe7a8, #ffb84d); box-shadow: 0 0 40px #ffc247; }
  .rope { position: absolute; left: 150px; right: 150px; bottom: 60px; height: 10px; border-radius: 6px; background: #c2185b; box-shadow: 0 3px 0 #7b0f3a; }
  .post { position: absolute; bottom: 0; width: 14px; height: 74px; border-radius: 6px; background: linear-gradient(90deg, #d4af37, #fff1b8, #d4af37); }
  .bouncer { position: absolute; right: 18px; bottom: 0; font-size: 92px; line-height: 1; }
  .guest { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; border-radius: 22px; background: var(--paper); color: var(--ink); display: grid; place-items: center; box-shadow: 0 10px 24px #0008; transition: transform 0.6s cubic-bezier(.3,1.3,.5,1), opacity 0.6s; }
  .guest .n { font-family: var(--f-m); font-size: 52px; font-weight: 600; direction: ltr; }
  .guest .tag { position: absolute; top: -12px; background: var(--neon-2); color: #001; font-size: 12px; font-weight: 900; border-radius: 8px; padding: 0 8px; }
  .guest.in { transform: translate(-260%, 0) scale(0.6); opacity: 0; }
  .guest.out { transform: translate(260%, 30px) rotate(25deg); opacity: 0; }
  .guest.enter { animation: walk 0.6s ease-out; } @keyframes walk { from { transform: translate(200%, 0); opacity: 0; } }
  .tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: #0006; } .tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold), var(--good)); transform-origin: left; }

  .rule { background: #000a; border: 2px solid var(--neon-2); border-radius: 16px; padding: 10px 12px; text-align: center; box-shadow: 0 0 14px #39d0ff44; }
  .rule .t { font-size: 14px; color: #a8ecff; font-weight: 800; } .rule .m { font-size: 24px; } .rule .lg { color: var(--neon); font-weight: 700; font-style: italic; }
  .rule .hint { font-size: 13.5px; color: #e3d8ff; margin-top: 4px; line-height: 1.7; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .act { font: inherit; font-size: 22px; font-weight: 900; border: 0; border-radius: 18px; padding: 16px 10px; cursor: pointer; color: #fff; transition: transform 0.1s; }
  .act.yes { background: var(--good); box-shadow: 0 6px 0 #15803d; } .act.no { background: var(--bad); box-shadow: 0 6px 0 #b91c1c; }
  .act:active { transform: translateY(3px); } .act[disabled] { opacity: 0.45; cursor: default; }
  .act:focus-visible, .btn:focus-visible, #sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 9px; animation: up 0.3s ease; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .card h2 { margin: 0; font-size: 19px; font-weight: 900; } .card p { margin: 0; line-height: 1.85; font-size: 15.5px; }
  .card .m { color: var(--blue); }
  .chk { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px 10px; font-size: 15px; flex-wrap: wrap; }
  .chk .m { font-size: 19px; color: var(--ink); }
  .ok { color: var(--good); font-weight: 900; } .no { color: var(--bad); font-weight: 900; }
  .verdict.ok { background: var(--good-soft); border-radius: 12px; padding: 8px 12px; } .verdict.no { background: var(--bad-soft); border-radius: 12px; padding: 8px 12px; }
  .btn { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer; background: var(--orange); color: #fff; box-shadow: 0 4px 0 #b9581a; align-self: flex-start; }
  .btn.big { font-size: 20px; padding: 15px 30px; align-self: center; }
  .nl { width: 100%; height: auto; }
  .nlt { font: 18px "STIX Two Text", serif; fill: #475569; direction: ltr; unicode-bidi: bidi-override; }
  .intro { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; background: linear-gradient(180deg, var(--wall-2), var(--wall)); border: 2px solid var(--edge); border-radius: 22px; padding: 18px 14px; }
  .intro h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); font-weight: 900; line-height: 1.1; } .intro h1 em { font-style: normal; color: var(--neon); text-shadow: 0 0 14px var(--neon); }
  .intro p { margin: 0; color: #ddd0ff; line-height: 1.8; }
  .how { display: grid; gap: 8px; width: 100%; text-align: start; }
  .how div { background: #00000055; border-radius: 12px; padding: 9px 12px; font-size: 14.5px; line-height: 1.8; display: flex; gap: 10px; align-items: flex-start; }
  .how b.n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--neon); display: grid; place-items: center; }
  .lose { background: #3b0d1d; border: 2px solid var(--bad); border-radius: 12px; padding: 9px 12px; font-size: 14.5px; line-height: 1.8; width: 100%; text-align: start; }
  .conf { position: fixed; top: -14px; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 60; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  footer { text-align: center; color: #9a8cc4; font-size: 12.5px; } footer a { color: inherit; }
  @media (max-width: 440px) { .bouncer { font-size: 70px; } .door { width: 96px; height: 140px; } .rope { left: 120px; right: 110px; } .sign { font-size: 19px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

    { name: 'الشرط الثاني', sign: 'نادي الشرط الثاني', rule: m(C2), hint: 'يدخل كل عدد يحقق هذا الشرط.', test: c2, uses: [2], G: [-4, 2, 3, -5, 0, 1.5, -3], set: [-4, 2], opt: 'د', optTxt: 'وهي الخيار د في الفيديو: حل المتباينة الثانية وحدها.', time: 8 },
    { name: 'and', sign: 'نادي and', rule: `${m(C1)} <span class="lg">and</span> ${m(C2)}`, hint: '<b>and</b>: يدخل العدد فقط إذا حقق <b>الشرطين معًا</b>.', test: (x) => c1(x) && c2(x), uses: [1, 2], logic: 'and', G: [3, -3, 0, 2, -1, 4, 1.5], set: [-1, 2], opt: 'ج', optTxt: 'وهي الخيار ج: الجواب الصحيح لسؤال الفيديو، الجزء المشترك فقط.', time: 8 },
    { name: 'or', sign: 'نادي or', rule: `${m(C1)} <span class="lg">or</span> ${m(C2)}`, hint: '<b>or</b>: يكفي أن يحقق العدد <b>شرطًا واحدًا</b> على الأقل.', test: (x) => c1(x) || c2(x), uses: [1, 2], logic: 'or', G: [3, -3, 5, -4.5, 0, 4, -5], set: [-4, 4], opt: 'أ', optTxt: 'وهي الخيار أ: لو كان السؤال or بدل and.', time: 7 },
  ];
  let lv = 0, gi = 0, hearts = 3, score = 0, streak = 0, bestStreak = 0, tId = null, left = 0, locked = false, done = [];

  // الأصوات
  let ac = null, soundOn = true;
  const tone = (seq, type = 'triangle', vol = 0.1) => { if (!soundOn) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); let t = ac.currentTime; seq.forEach(([f, d]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); t += d * 0.85; }); } catch (e) {} };
  const yes = () => tone([[523, 0.09], [784, 0.16]]), nope = () => tone([[180, 0.3]], 'sawtooth', 0.07), tick = () => tone([[1500, 0.03]], 'square', 0.03), fan = () => tone([[392, 0.12], [523, 0.12], [659, 0.12], [784, 0.3]]), beat = () => tone([[70, 0.12]], 'sine', 0.35);
  $('#sound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 بلا صوت'; e.currentTarget.setAttribute('aria-pressed', soundOn); });
  const confetti = (n = 70) => { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cols = ['#ff3cac', '#39d0ff', '#ffc247', '#22c55e', '#fff']; for (let k = 0; k < n; k++) { const d = document.createElement('div'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[k % cols.length]; d.style.animationDuration = 1.4 + Math.random() * 1.6 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); } };

  const hud = () => {
    $('#hearts').innerHTML = [1, 2, 3].map((k) => `<span class="${k <= hearts ? '' : 'off'}">❤️</span>`).join('');
    $('#score').textContent = score; $('#combo').textContent = streak >= 3 ? `🔥 ×2 (${streak})` : streak >= 1 ? `🔥 ${streak}` : '';
    $('#lvls').innerHTML = L.map((o, k) => `<div class="lv ${done[k] ? 'done' : k === lv ? 'now' : ''}">${k + 1}. ${o.name}</div>`).join('');
  };
  const setT = () => { $('#tb').style.transform = `scaleX(${Math.max(0, left) / L[lv].time})`; };
  const stop = () => { clearInterval(tId); tId = null; };

  const intro = () => {
    hud(); $('#sign').textContent = 'نادي البنيان';
    $('#game').innerHTML = `<div class="intro"><h1>بوّاب <em>النادي</em> 🕴️</h1>
      <p>أنت بوّاب نادي الأعداد. كل ضيف عدد يريد الدخول، وقانون الدخول متباينة. هل يدخل أم يُمنع؟</p>
      <div class="how">
        <div><b class="n">1</b><span>اقرأ <b>قانون الدخول</b> في اللوحة الزرقاء.</span></div>
        <div><b class="n">2</b><span>يصل ضيف عليه عدد. عوّض العدد في الشرط بسرعة.</span></div>
        <div><b class="n">3</b><span>اضغط <b>«✓ يدخل»</b> إذا حقق القانون، أو <b>«✗ ممنوع»</b> إذا لم يحققه، قبل انتهاء الشريط.</span></div>
        <div><b class="n">4</b><span>بعد كل قرار يظهر <b>التحقق</b>: قيمة كل شرط، وهل تحقق. ثلاث إجابات صحيحة متتالية = نقاط مضاعفة 🔥.</span></div>
        <div><b class="n">5</b><span>أربعة مستويات: الشرط الأول، الشرط الثاني، ثم <b>and</b>، ثم <b>or</b>. وفي نهاية كل مستوى ترى الضيوف المقبولين على خط الأعداد.</span></div>
      </div>
      <div class="lose">⚠️ <b>يمكنك أن تخسر!</b> كل قرار خاطئ أو تأخير يُفقدك ❤️، وعند خسارة القلوب الثلاثة يُطرد البوّاب وتنتهي اللعبة.</div>
      <button type="button" class="btn big" id="go">🚪 افتح النادي</button></div>`;
    $('#go').addEventListener('click', () => { beat(); startLevel(0); });
  };

  const startLevel = (k) => {
    lv = k; gi = 0; hud();
    const o = L[lv]; $('#sign').textContent = o.sign;
    $('#game').innerHTML = `<div class="card" style="text-align:center"><h2>المستوى ${lv + 1}: ${o.name}</h2><div class="rule"><div class="t">قانون الدخول</div>${o.rule}<div class="hint">${o.hint}</div></div>
      <button type="button" class="btn big" id="st">ابدأ المستوى ▶</button></div>`;
    $('#st').addEventListener('click', () => { beat(); nextGuest(); });
  };

  const nextGuest = () => {
    const o = L[lv], x = o.G[gi]; locked = false; hud(); window.__truth = o.test(x);
    const g = $('#guest'); g.className = 'guest'; g.style.opacity = 1; void g.offsetWidth; g.classList.add('enter'); $('#gn').textContent = num(x); $('#door').classList.remove('open');
    $('#game').innerHTML = `<div class="rule"><div class="t">قانون الدخول · الضيف ${gi + 1} من ${o.G.length}</div>${o.rule}<div class="hint">${o.hint}</div></div>
      <div class="acts"><button type="button" class="act yes" id="ay">✓ يدخل</button><button type="button" class="act no" id="an">✗ ممنوع</button></div><div id="after"></div>`;
    $('#ay').addEventListener('click', () => decide(true));
    $('#an').addEventListener('click', () => decide(false));
    left = o.time; setT(); stop();
    tId = setInterval(() => { left -= 0.1; setT(); if (Math.abs(left - Math.round(left)) < 0.05 && left <= 3 && left > 0) tick(); if (left <= 0) { stop(); decide(null); } }, 100);
  };

  const decide = (letIn) => {
    if (locked) return; locked = true; stop();
    const o = L[lv], x = o.G[gi], truth = o.test(x), right = letIn === truth;
    document.querySelectorAll('.act').forEach((b) => (b.disabled = true));
    const g = $('#guest');
    if (truth) { $('#door').classList.add('open'); g.classList.add('in'); } else g.classList.add('out');
    if (right) { streak++; bestStreak = Math.max(bestStreak, streak); score += streak >= 3 ? 20 : 10; yes(); }
    else { streak = 0; hearts--; nope(); const c = $('#club'); c.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 300 }); }
    hud();
    const r1 = c1(x), r2 = c2(x);
    const line = (k) => k === 1 ? `<div class="chk">الشرط الأول: ${m(show1(x))} <span class="${r1 ? 'ok' : 'no'}">${r1 ? '✓' : '✗'}</span></div>` : `<div class="chk">الشرط الثاني: ${m(show2(x))} <span class="${r2 ? 'ok' : 'no'}">${r2 ? '✓' : '✗'}</span></div>`;
    const why = o.logic === 'and' ? (truth ? 'الشرطان تحققا معًا، فيدخل.' : `${r1 || r2 ? 'تحقق شرط واحد فقط، و and تطلب الشرطين معًا' : 'لم يتحقق أي شرط'}، فيُمنع.`)
      : o.logic === 'or' ? (truth ? `${r1 && r2 ? 'تحقق الشرطان' : 'تحقق شرط واحد، و or يكفيها شرط واحد'}، فيدخل.` : 'لم يتحقق أي شرط، فيُمنع.')
      : (truth ? 'الشرط تحقق، فيدخل.' : 'الشرط لم يتحقق، فيُمنع.');
    $('#after').innerHTML = `<div class="card"><div class="verdict ${right ? 'ok' : 'no'}"><b>${letIn === null ? '⏱ تأخرت! ' : ''}${right ? '✓ قرار صحيح' : '✗ قرار خاطئ'}</b> · الضيف ${m(num(x))} ${truth ? 'يدخل ✓' : 'ممنوع ✗'}</div>
      ${o.uses.map(line).join('')}<p>${why}</p><button type="button" class="btn" id="nx">${hearts <= 0 ? 'النتيجة' : gi + 1 < o.G.length ? 'الضيف التالي ←' : 'نهاية المستوى ←'}</button></div>`;
    $('#nx').addEventListener('click', () => { if (hearts <= 0) return over(); gi++; if (gi < o.G.length) nextGuest(); else endLevel(); });
    $('#nx').focus({ preventScroll: true });
  };

  // خط الأعداد: الضيوف المقبولون والفترة
  const nlSvg = (o) => {
    const W = 600, x0 = 30, x1 = 570, u = (x1 - x0) / 12, xv = (v) => 300 + v * u;
    let s = `<line x1="${x0}" y1="60" x2="${x1}" y2="60" stroke="#94a3b8" stroke-width="3"/>`;
    for (let v = -6; v <= 6; v++) s += `<line x1="${xv(v)}" y1="52" x2="${xv(v)}" y2="68" stroke="#94a3b8" stroke-width="2"/><text x="${xv(v)}" y="92" text-anchor="middle" class="nlt">${num(v)}</text>`;
    s += `<line x1="${xv(o.set[0])}" y1="60" x2="${xv(o.set[1])}" y2="60" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/><circle cx="${xv(o.set[0])}" cy="60" r="9" fill="#22c55e"/><circle cx="${xv(o.set[1])}" cy="60" r="9" fill="#22c55e"/>`;
    o.G.forEach((x) => { const t = o.test(x); s += `<circle cx="${xv(x)}" cy="28" r="9" fill="${t ? '#22c55e' : '#ef4444'}"/><text x="${xv(x)}" y="33" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">${t ? '✓' : '✗'}</text>`; });
    return `<svg class="nl" viewBox="0 0 ${W} 100">${s}</svg>`;
  };
  const endLevel = () => {
    done[lv] = true; hud(); fan(); confetti(40); $('#guest').style.opacity = 0;
    const o = L[lv];
    $('#game').innerHTML = `<div class="card"><h2>🎉 أنهيت المستوى ${lv + 1}: ${o.name}</h2>${nlSvg(o)}
      <p>الضيوف المقبولون يقعون في الفترة ${m(`[${num(o.set[0])} , ${num(o.set[1])}]`)}. ${o.optTxt}</p>
      ${lv === 2 ? `<p><b>لاحظ:</b> ${m('3')} حقق الأول فقط، و ${m('−3')} حقق الثاني فقط، فمُنعا في نادي and.</p>` : ''}
      <button type="button" class="btn big" id="nl">${lv < 3 ? `المستوى التالي: ${L[lv + 1].name} ▶` : '🏆 النتيجة النهائية'}</button></div>`;
    $('#nl').addEventListener('click', () => { if (lv < 3) startLevel(lv + 1); else finish(true); });
  };

  const over = () => finish(false);
  const finish = (won) => {
    stop(); $('#guest').style.opacity = 0; $('#sign').textContent = won ? 'نادي البنيان 🏆' : 'مغلق 🚫';
    let rec = 0; try { rec = +localStorage.getItem('bunyan-club') || 0; if (score > rec) localStorage.setItem('bunyan-club', score); } catch (e) {}
    const rank = !won ? 'طُرد البوّاب! 😅' : hearts === 3 ? 'بوّاب أسطوري 🏆' : hearts === 2 ? 'بوّاب محترف 🥇' : 'بوّاب ناجح 🥈';
    $('#game').innerHTML = `<div class="card" style="text-align:center;align-items:center"><div style="font-size:70px">${won ? '🏆' : '🚫'}</div><h2>${rank}</h2>
      <p style="font-family:'Orbitron',monospace;font-size:34px;color:#1b2742">${score}</p>
      <p>${score > rec ? '🎉 رقم قياسي جديد على هذا الجهاز!' : `رقمك القياسي: ${rec}`} · أطول سلسلة صحيحة: ${bestStreak} 🔥</p>
      <p style="text-align:start"><b>الخلاصة:</b> <b>and</b> = الجزء المشترك ⇐ ${m('[−1 , 2]')}، وهو الجواب الصحيح. و <b>or</b> = اتحاد الفترتين ⇐ ${m('[−4 , 4]')}.</p>
      <p>📸 صوّر نتيجتك وشاركها في التعليقات!</p>
      <button type="button" class="btn big" id="again">↺ العب من جديد</button></div>`;
    if (won) { fan(); confetti(130); } else nope();
    $('#again').addEventListener('click', () => { hearts = 3; score = 0; streak = 0; bestStreak = 0; done = []; startLevel(0); });
  };

  intro();
})();
</script>
</body>
</html>

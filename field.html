<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سياج المزرعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Orbitron:wght@700;900&display=swap">
<style>
  :root { --f-ar: "Cairo", "Segoe UI", Tahoma, sans-serif; --f-m: "STIX Two Text", "Cambria Math", "Times New Roman", serif; --f-led: "Orbitron", "Cairo", monospace;
    --orange: #f07a2a; --gold: #ffc247; --good: #22c55e; --good-soft: #dcfce7; --bad: #ef4444; --bad-soft: #fee2e2; --paper: #fffdf6; --ink: #1b2742; --muted: #5d6b84; --muted2: #8a93a6;
    --bgc: #0f2d14; --bg: radial-gradient(ellipse at 50% -10%, #2f6b2a, #0f2d14 70%); --txt: #fff; --hud: #173d1c; --stage: #6b4f2a; --accent: #8bd17c; }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  html { background: var(--bgc); }
  body { margin: 0; font-family: var(--f-ar); color: var(--txt); direction: rtl; background: var(--bg); background-attachment: fixed;
    padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .m { font-family: var(--f-m); direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-size: 1.08em; }
  .m i { font-style: italic; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--orange); }
  .who b { display: block; font-size: 16px; font-weight: 900; } .who span { font-size: 12px; color: var(--accent); font-weight: 800; }
  #sound { margin-inline-start: auto; font: inherit; font-size: 13px; color: inherit; background: #ffffff22; border: 1px solid #8884; border-radius: 20px; padding: 4px 12px; cursor: pointer; }
  .hud { display: flex; align-items: center; gap: 10px; background: var(--hud); color: #fff; border-radius: 14px; padding: 8px 12px; flex-wrap: wrap; }
  .lives { font-size: 20px; letter-spacing: 2px; } .lives .off { filter: grayscale(1); opacity: 0.25; }
  .score { font-family: var(--f-led); color: var(--gold); font-size: 16px; direction: ltr; }
  .ms { display: flex; gap: 5px; margin-inline-start: auto; flex-wrap: wrap; }
  .mc { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; background: #ffffff1c; color: #dde; border: 2px solid transparent; }
  .mc.now { border-color: var(--gold); color: #fff; } .mc.done { background: var(--good); color: #fff; } .mc.lost { background: var(--bad); color: #fff; }
  .timer { height: 8px; border-radius: 6px; background: #0002; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold), var(--good)); transform-origin: right; }
  .stage { position: relative; background: var(--stage); border-radius: 22px; padding: 10px; box-shadow: 0 8px 0 #0003; }
  .stage svg { width: 100%; max-width: 560px; display: block; margin: 0 auto; touch-action: manipulation; }
  .brow { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .tag { flex: 1; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 6px 12px; text-align: center; font-weight: 800; font-size: 16px; line-height: 1.6; }
  .tag small { display: block; font-size: 11px; color: var(--muted); }
  .pick [data-z] { cursor: pointer; }
  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: up 0.3s ease; box-shadow: 0 6px 18px #0002; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .card h2 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.6; } .card p { margin: 0; line-height: 1.85; font-size: 15.5px; }
  .card h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--accent); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; } .st { flex: 1; min-width: 70px; text-align: center; font-size: 12.5px; font-weight: 900; padding: 4px; border-radius: 10px; background: #0000000f; color: var(--muted); }
  .st.now { background: var(--orange); color: #fff; } .st.ok { background: var(--good); color: #fff; } .st.bad { background: var(--bad); color: #fff; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts.one { grid-template-columns: 1fr; }
  .opt { font: inherit; font-size: 17px; font-weight: 900; padding: 13px 8px; border-radius: 14px; border: 2px solid #0002; background: #fff; color: var(--ink); cursor: pointer; transition: transform 0.12s; line-height: 1.6; }
  .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--orange); }
  .opt:disabled { cursor: default; opacity: 0.6; } .opt.ok { background: var(--good-soft); border-color: var(--good); opacity: 1; } .opt.bad { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }
  .opt .m { font-size: 21px; }
  .fb { border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.85; font-weight: 700; }
  .fb.ok { background: var(--good-soft); color: #14532d; } .fb.bad { background: var(--bad-soft); color: #7f1d1d; }
  .go { font: inherit; font-size: 18px; font-weight: 900; color: #fff; background: var(--orange); border: 0; border-radius: 16px; padding: 12px 20px; cursor: pointer; box-shadow: 0 6px 0 #b9581a; }
  .go:active { transform: translateY(3px); box-shadow: 0 3px 0 #b9581a; }
  ol.how { margin: 0; padding-inline-start: 22px; line-height: 1.9; font-size: 15.5px; }
  .warn { background: #fff4e5; border: 2px dashed var(--orange); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14.5px; line-height: 1.8; color: #5a3a12; }
  .rule { background: var(--hud); color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 14.5px; line-height: 1.95; font-weight: 700; }
  .rule .m { color: var(--gold); }
  .stars { font-size: 44px; text-align: center; letter-spacing: 6px; } .stars .off { filter: grayscale(1); opacity: 0.25; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; } .tbl td { padding: 6px; border-bottom: 1px solid #0001; }
  footer { text-align: center; font-size: 12px; color: var(--muted2); padding-top: 6px; }
  .shake { animation: shk 0.35s 2; } @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .card, .shake { animation: none; } }


  .gl { stroke: #2d5a2733; stroke-width: 1; } .axl { stroke: #1f3d1a; stroke-width: 2.5; }
  .tk { font: 600 12px "STIX Two Text", serif; fill: #2d4a25; direction: ltr; unicode-bidi: bidi-override; }
  .gp { fill: #1f3d1a; opacity: 0.18; } .pick .gp { opacity: 0.35; } .pick .gp:hover, .pick .gp:focus { opacity: 1; fill: #f07a2a; outline: none; }
  .gp.zok { fill: #22c55e; opacity: 1; } .gp.zbad { fill: #ef4444; opacity: 1; }
  .lab { font: 700 16px "STIX Two Text", serif; fill: #1b2742; direction: ltr; unicode-bidi: bidi-override; }
  .big { font: 700 22px "STIX Two Text", serif; direction: ltr; unicode-bidi: bidi-override; }
  
</style>
</head>

<script>
const m = (t) => `<span class="m">${t}</span>`;

const X0 = -6, X1 = 8, Y0 = -9, Y1 = 9;
const px = (x) => 40 + (x - X0) * 34, py = (y) => 20 + (Y1 - y) * 20;
const sg = (n) => (n < 0 ? '−' + -n : '' + n);
const fa = (A) => (A === 0.5 ? '½' : A === 1 ? '' : A === -1 ? '−' : sg(A));
const fx = (A, h, k) => `${fa(A)}|x ${h < 0 ? '+ ' + -h : '− ' + h}|${k < 0 ? ' − ' + -k : ' + ' + k}`;
const shuffle = (o, seed) => { for (let i = o.length - 1; i > 0; i--) { const j = (i * 7 + seed * 3) % (i + 1); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const uniq = (arr) => { const s = new Set(); return arr.filter((x) => (s.has(x.key) ? false : s.add(x.key))); };
const mk = ([A, h, k], seed) => {
  const d = -k / A, z1 = h - d, z2 = h + d, H = Math.abs(k), area = d * H;
  const F = fx(A, h, k);
  const zo = (a, b) => ({ key: a + ',' + b, h: m(`<i>x</i> = ${sg(a)} ، <i>x</i> = ${sg(b)}`) });
  const zs = uniq([{ ...zo(z1, z2), v: 'ok' }, { ...zo(-d, d), v: 'noh' }, { ...zo(h - H, h + H), v: 'noA' }, { ...zo(-z2, -z1), v: 'sgn' }, { ...zo(h, -k), v: 'hk' }]).slice(0, 4);
  const ao = uniq([{ key: area, v: 'ok', h: m(area) }, { key: 2 * area, v: 'half', h: m(2 * area) }, { key: area / 2, v: 'hb', h: m(area / 2) }, { key: 2 * d + H, v: 'add', h: m(2 * d + H) }]);
  const wrongV = {};
  wrongV[`${-h},${k}`] = { cat: 'h', tip: `${m('<i>h</i>')} هي العدد الذي يجعل ما داخل المطلق صفرًا: ${m(`${h} ${h < 0 ? '+ ' + -h : '− ' + h} = 0`)}، فلا نأخذ الإشارة كما نراها.` };
  wrongV[`${h},${-k}`] = { cat: 'k', tip: `${m('<i>k</i>')} هو الحد الثابت خارج المطلق بإشارته: ${m('<i>k</i> = ' + sg(k))}.` };
  wrongV[`${-h},${-k}`] = { cat: 'h', tip: 'أخطأت في إشارتي الإحداثيين معًا. الرأس هو ' + m(`(${sg(h)} , ${sg(k)})`) + '.' };
  return {
    A, h, k, d, z1, z2, area, F,
    tag: `<small>الحقل</small>${m('<i>f</i>(<i>x</i>) = ' + F)}`,
    steps: [

        opts: [{ v: 'up', h: '⋁ إلى الأعلى' }, { v: 'down', h: '⋀ إلى الأسفل' }], ok: A > 0 ? 'up' : 'down', cat: 'dir',
        tip: `انظر إلى المعامل قبل المطلق: ${m(sg(A === 0.5 ? '½' : A))}.`, why: `المعامل ${A > 0 ? 'موجب ⇐ الفتحة إلى الأعلى والرأس أخفض نقطة' : 'سالب ⇐ الفتحة إلى الأسفل والرأس أعلى نقطة'}.` },
      { label: '② الرأس', q: 'اضغط على نقطة الرأس على الشبكة.', tapHint: 'اضغط على نقطة الرأس على الشبكة في الأعلى.',
        hint: `الصورة العامة: ${m('<i>a</i>|<i>x</i> − <i>h</i>| + <i>k</i>')} والرأس ${m('(<i>h</i> , <i>k</i>)')}.`,
        ok: `${h},${k}`, cat: 'h', wrong: wrongV, tip: `الرأس هو ${m(`(${sg(h)} , ${sg(k)})`)}.`,
        why: `الرأس ${m(`(${sg(h)} , ${sg(k)})`)}.`, after: async (sv) => { await drawV(sv, seed); } },
      { label: '③ التقاطع', q: 'أين يقطع المنحنى محور السينات؟', hint: `نحل ${m('<i>f</i>(<i>x</i>) = 0')}.`,
        opts: shuffle(zs, seed), ok: 'ok', cat: 'zeros',
        wrong: { noh: { cat: 'zeros', tip: `نسيتَ ${m('<i>h</i>')}: الحلّان على بعد ${m(d)} من ${m(sg(h))} يمينًا ويسارًا.` }, noA: { cat: 'zeros', tip: `نسيتَ القسمة على المعامل ${m(sg(A === 0.5 ? '½' : A))}.` }, sgn: { cat: 'zeros', tip: 'الإشارات معكوسة: الحلّان حول الرأس ' + m(sg(h)) + '.' }, hk: { cat: 'zeros', tip: 'هذه ليست حلول ' + m('<i>f</i>(<i>x</i>) = 0') + '.' } },

  for (let x = X0; x <= X1; x++) s += `<line class="gl" x1="${px(x)}" y1="${py(Y1)}" x2="${px(x)}" y2="${py(Y0)}"/>`;
  for (let y = Y0; y <= Y1; y++) s += `<line class="gl" x1="${px(X0)}" y1="${py(y)}" x2="${px(X1)}" y2="${py(y)}"/>`;
  s += `<line class="axl" x1="${px(X0) - 10}" y1="${py(0)}" x2="${px(X1) + 14}" y2="${py(0)}"/><line class="axl" x1="${px(0)}" y1="${py(Y0)}" x2="${px(0)}" y2="${py(Y1) - 6}"/>`;
  for (let x = X0; x <= X1; x += 2) if (x) s += `<text class="tk" x="${px(x)}" y="${py(0) + 15}" text-anchor="middle">${sg(x)}</text>`;
  for (let y = Y0 + 1; y <= Y1; y += 2) if (y) s += `<text class="tk" x="${px(0) - 6}" y="${py(y) + 4}" text-anchor="end">${sg(y)}</text>`;
  s += `<text class="lab" x="${px(X1) + 8}" y="${py(0) - 6}">x</text><text class="lab" x="${px(0) + 6}" y="${py(Y1) + 4}">y</text>`;
  s += `<polygon id="tri" fill="#8bd17c" fill-opacity="0.55" stroke="#2f6b2a" stroke-width="2" opacity="0" points=""/><polyline id="vv" fill="none" stroke="#c62828" stroke-width="4" stroke-linejoin="round" points=""/><g id="labs"></g><g id="pts">`;
  for (let x = X0; x <= X1; x++) for (let y = Y0; y <= Y1; y++) s += `<circle class="gp" data-z="${x},${y}" cx="${px(x)}" cy="${py(y)}" r="6" aria-label="(${x}, ${y})"/>`;
  sv.innerHTML = s + '</g>';
};
let curT = null;
const drawV = async (sv) => {
  const { A, h, k } = curT, f = (x) => A * Math.abs(x - h) + k, xa = Math.max(X0, h - 9), xb = Math.min(X1, h + 9);
  const clip = (x) => { const y = f(x); return y > Y1 || y < Y0 ? null : [x, y]; };
  const L = [], R = [];
  for (let i = 0; i <= 60; i++) { const x = h - (h - xa) * i / 60, p = clip(x); if (p) L.push(p); }
  for (let i = 0; i <= 60; i++) { const x = h + (xb - h) * i / 60, p = clip(x); if (p) R.push(p); }
  const pts = [...L.reverse(), ...R].map(([x, y]) => px(x).toFixed(1) + ',' + py(y).toFixed(1));
  const el = sv.querySelector('#vv');
  await anim(700, (q) => el.setAttribute('points', pts.slice(0, Math.max(2, Math.round(pts.length * q))).join(' ')));
  sv.querySelector('#labs').innerHTML = `<rect x="${px(h) - 34}" y="${py(k) + (A > 0 ? 8 : -34)}" width="68" height="26" rx="6" fill="#c62828"/><text class="lab" x="${px(h)}" y="${py(k) + (A > 0 ? 27 : -15)}" text-anchor="middle" style="fill:#fff">(${sg(h)}, ${sg(k)})</text>`;
};
const fill = async (sv) => {
  const { h, k, z1, z2 } = curT, tri = sv.querySelector('#tri');
  tri.setAttribute('points', `${px(z1)},${py(0)} ${px(h)},${py(k)} ${px(z2)},${py(0)}`);
  await anim(500, (q) => tri.setAttribute('opacity', q));
  sv.querySelector('#labs').insertAdjacentHTML('beforeend', `<circle cx="${px(z1)}" cy="${py(0)}" r="7" fill="#1f6fd6"/><circle cx="${px(z2)}" cy="${py(0)}" r="7" fill="#1f6fd6"/>`);
  SND.beep(523, 0.1, 'triangle'); SND.beep(659, 0.1, 'triangle', 0.12, 0.1);
};
const GAME = {
  id: 'field', title: 'سياج المزرعة', icon: '🌾', life: '🥕', lifeName: 'جزرات', time: 45,
  intro: `<p>المزارع يريد سياجًا مثلث الشكل: ضلعاه منحنى القيمة المطلقة، وقاعدته على محور السينات. ساعده: حدّد اتجاه المنحنى، ورأسه، ونقطتي التقاطع، ثم احسب مساحة الحقل.</p>`,
  rule: `${m('<i>f</i>(<i>x</i>) = <i>a</i>|<i>x</i> − <i>h</i>| + <i>k</i>')} ⇐ الرأس ${m('(<i>h</i> , <i>k</i>)')} · ${m('<i>a</i> > 0')} الفتحة للأعلى · مساحة المثلث ${m('½ × القاعدة × الارتفاع')}`,
  how: ['حدّد اتجاه فتحة المنحنى من إشارة المعامل.', 'اضغط على نقطة الرأس على الشبكة.', 'اختر نقطتي التقاطع مع محور السينات.', 'احسب مساحة الحقل المثلث.'],
  startLabel: 'ابدأ بناء السياج', nextLabel: 'الحقل التالي',
  stages: [
    { name: 'مزارع مبتدئ', msg: 'معاملات بسيطة.', missions: [[1, -1, -4], [-1, 2, 3]] },
    { name: 'مزارع ماهر', msg: 'منها حقل الفيديو نفسه!', missions: [[2, 3, -6], [3, 4, -6]] },
    { name: 'خبير الحقول', msg: 'منحنيات مقلوبة ومعاملات كسرية.', missions: [[-2, -1, 8], [0.5, 2, -2]] },
  ].map((s, i) => ({ ...s, missions: s.missions.map((c, j) => mk(c, i * 2 + j)) })),
  draw: (sv, t) => { curT = t; drawGrid(sv, t); },
  idle: (sv) => { sv.innerHTML = `<rect x="0" y="0" width="560" height="400" rx="14" fill="#f3f8e8"/><text x="280" y="215" text-anchor="middle" style="font-size:96px">🌾</text>`; },
  tagIdle: 'حقول المثلثات',
  cats: {
    dir: ['⋁ اتجاه الفتحة', 'المعامل الموجب ⇐ للأعلى، والسالب ⇐ للأسفل.'],
    h: ['📍 إحداثي الرأس ' + m('<i>h</i>'), m('<i>h</i>') + ' يجعل ما داخل المطلق صفرًا: ' + m('|<i>x</i> − 3|') + ' ⇐ ' + m('<i>h</i> = 3') + '.'],
    k: ['📍 إحداثي الرأس ' + m('<i>k</i>'), m('<i>k</i>') + ' هو الحد الثابت خارج المطلق بإشارته.'],
    zeros: ['✂️ نقطتا التقاطع', 'اعزل المطلق ثم: ' + m('|<i>x</i> − <i>h</i>| = <i>d</i>') + ' ⇐ ' + m('<i>x</i> = <i>h</i> ± <i>d</i>') + '.'],
    area: ['📏 المساحة', m('½ × القاعدة × الارتفاع') + '، والارتفاع ' + m('|<i>k</i>|') + '.'],
  },
  summary: `حقل الفيديو: ${m('<i>f</i>(<i>x</i>) = 2|<i>x</i> − 3| − 6')} ⇐ الرأس ${m('(3 , −6)')} ⇐ التقاطع ${m('0')} و ${m('6')} ⇐ المساحة ${m('½ × 6 × 6 = 18')}.`,
  winTitle: '🏆 خبير الحقول!', loseTitle: '🥕 نفدت الجزرات',
};


(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.REDUCE = reduce;
  let store = null; try { store = window.localStorage; } catch (e) {}
  const KEY = 'albunyan-' + GAME.id + '-rec';
  const getRec = () => { try { return +(store && store.getItem(KEY)) || 0; } catch (e) { return 0; } };
  const setRec = (v) => { try { store && store.setItem(KEY, String(v)); } catch (e) {} };
  let ac = null, soundOn = true;
  const beep = (f, d = 0.12, type = 'sine', v = 0.15, at = 0) => {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  };
  const S = window.SND = {
    tick: () => beep(1700, 0.03, 'square', 0.04),
    ok: () => { beep(660, 0.1, 'triangle'); beep(990, 0.16, 'triangle', 0.15, 0.09); },
    bad: () => { beep(180, 0.3, 'sawtooth', 0.12); beep(140, 0.3, 'sawtooth', 0.1, 0.12); },
    start: () => { beep(523, 0.12, 'triangle'); beep(784, 0.2, 'triangle', 0.14, 0.12); },
    done: () => [659, 784, 988].forEach((f, i) => beep(f, 0.18, 'triangle', 0.14, i * 0.09)),
    win: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.22, 'triangle', 0.15, i * 0.12)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.28, 'sawtooth', 0.09, i * 0.16)),
    beep,
  };
  $('#sound').onclick = (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 الصوت'; e.currentTarget.setAttribute('aria-pressed', soundOn); };
  window.anim = (dur, fn) => new Promise((res) => {
    if (reduce) { fn(1); return res(); }
    const t0 = performance.now();
    const step = (now) => { const k = Math.min(1, (now - t0) / dur); fn(k); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  window.wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

  const ALL = GAME.stages.flatMap((s, i) => s.missions.map((mm) => ({ ...mm, st: i })));
  const TIME = GAME.time || 40, LIVES = 3;
  let idx = 0, lives = LIVES, score = 0, sidx = 0, timer = null, left = TIME, res = [], miss = {}, okAll = true, busy = false;
  const g = $('#game');
  const hud = () => {
    $('#lives').innerHTML = [0, 1, 2].map((i) => `<span class="${i < lives ? '' : 'off'}">${GAME.life}</span>`).join('');
    $('#score').textContent = score;
    $('#ms').innerHTML = ALL.map((_, i) => `<span class="mc ${res[i] === 1 ? 'done' : res[i] === 0 ? 'lost' : i === idx ? 'now' : ''}">${i + 1}</span>`).join('');
  };
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const startTimer = () => {
    stopTimer(); left = TIME; $('#tbar').style.transform = 'scaleX(1)';
    timer = setInterval(() => {
      left -= 0.1; $('#tbar').style.transform = `scaleX(${Math.max(0, left / TIME)})`;
      if (left <= 8 && Math.abs(left - Math.round(left)) < 0.05) S.tick();
      if (left <= 0) { stopTimer(); answer(null); }
    }, 100);
  };
  const lose1 = () => { lives--; hud(); const b = $('.stage'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); };
  const cur = () => ALL[idx];
  window.__step = () => cur() && cur().steps[sidx];
  const stepsBar = () => `<div class="steps">${cur().steps.map((s, i) => `<span class="st ${i < sidx ? (s._ok ? 'ok' : 'bad') : i === sidx ? 'now' : ''}">${s.label}</span>`).join('')}</div>`;

  const intro = () => {
    stopTimer(); idx = 0; lives = LIVES; score = 0; res = []; miss = {};
    $('#tag').innerHTML = GAME.tagIdle || '—'; GAME.idle && GAME.idle($('#sv')); hud();
    const rec = getRec();
    g.innerHTML = `<div class="card"><h1>${GAME.icon} ${GAME.title}</h1>${GAME.intro}
      ${GAME.rule ? `<div class="rule">🔑 ${GAME.rule}</div>` : ''}
      <h2>كيف تلعب؟</h2><ol class="how">${GAME.how.map((h) => `<li>${h}</li>`).join('')}</ol>
      <div class="warn">⚠️ يمكنك أن تخسر! معك ${m('3')} ${GAME.lifeName} ${GAME.life}. كل إجابة خاطئة أو انتهاء الوقت (${m(TIME + ' ث')}) يكلّفك واحدة، وإذا نفدت انتهت اللعبة.</div>
      <p>${ALL.length} مهام في ${GAME.stages.length} مراحل: ${GAME.stages.map((s) => `<b>${s.name}</b>`).join(' ← ')}. ${rec ? `أفضل نتيجة لك: <b class="m">${rec}</b>` : ''}</p>
      <button class="go" id="start">${GAME.startLabel || 'ابدأ'} 🚀</button></div>`;
    $('#start').onclick = () => { S.start(); next(); };
  };
  const next = () => {
    if (idx >= ALL.length) return end(true);
    sidx = 0; okAll = true; hud();
    const t = cur(); t.steps.forEach((s) => (s._ok = undefined));
    $('#tag').innerHTML = t.tag; GAME.draw($('#sv'), t);
    if (idx === 0 || ALL[idx - 1].st !== t.st) {
      const s = GAME.stages[t.st];
      g.innerHTML = `<div class="card" style="text-align:center"><h2>المرحلة ${t.st + 1}: ${s.name}</h2><p>${s.msg}</p><button class="go" id="gost">جاهز ✔</button></div>`;
      $('#gost').onclick = () => ask();
    } else ask();
  };
  const ask = () => {
    const t = cur(), s = t.steps[sidx]; busy = false;
    if (s.show) s.show($('#sv'), t);
    let body = '';
    if (s.opts) body = `<div class="opts ${s.one ? 'one' : ''}">${s.opts.map((o) => `<button class="opt" data-v="${o.v}">${o.h}</button>`).join('')}</div>`;
    else body = `<p>👆 ${s.tapHint || 'اضغط على الرسم في الأعلى.'}</p>`;
    g.innerHTML = `<div class="card">${stepsBar()}<h2>${s.q}</h2>${s.hint ? `<p style="font-size:14px;color:var(--muted)">${s.hint}</p>` : ''}${body}<div id="fb"></div></div>`;
    if (s.opts) g.querySelectorAll('.opt').forEach((b) => (b.onclick = () => answer(b.dataset.v, b)));
    else {
      const sv = $('#sv'); sv.classList.add('pick');
      sv.querySelectorAll('[data-z]').forEach((el) => {
        el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
        el.onclick = () => answer(el.dataset.z, el);
        el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); answer(el.dataset.z, el); } };
      });
      $('.stage').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    }
    startTimer();
  };
  const answer = async (v, el) => {
    if (busy) return; busy = true; stopTimer();
    const t = cur(), s = t.steps[sidx], ok = v != null && String(v) === String(s.ok);
    g.querySelectorAll('.opt').forEach((x) => (x.disabled = true));
    const sv = $('#sv'); sv.classList.remove('pick');
    sv.querySelectorAll('[data-z]').forEach((x) => { x.onclick = null; x.onkeydown = null; x.setAttribute('tabindex', '-1'); });
    if (s.opts) { const r = g.querySelector(`.opt[data-v="${CSS.escape(String(s.ok))}"]`); r && r.classList.add('ok'); if (!ok && el) el.classList.add('bad'); }
    else { const r = sv.querySelector(`[data-z="${CSS.escape(String(s.ok))}"]`); r && r.classList.add('zok'); if (!ok && el) el.classList.add('zbad'); }
    s._ok = ok;
    let tip = '';
    if (!ok) {
      const w = (s.wrong && v != null && s.wrong[v]) || null;
      const cat = (w && w.cat) || s.cat; miss[cat] = (miss[cat] || 0) + 1; okAll = false;
      tip = v == null ? '⏰ انتهى الوقت!' : '✗ ' + ((w && w.tip) || s.tip || 'ليست هذه.');
      S.bad(); lose1();
    } else { S.ok(); score += 100; if (sidx === t.steps.length - 1) score += Math.round(left * 4); hud(); }
    if (s.after) await s.after($('#sv'), t, ok, v);
    const last = sidx === t.steps.length - 1;
    if (last) { res[idx] = okAll ? 1 : 0; hud(); if (okAll) S.done(); }
    $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✓ ' : tip + '<br>'}${s.why || ''}</div>${lives <= 0 ? '' : `<button class="go" id="cont">${last ? (idx === ALL.length - 1 ? 'النتيجة 🏁' : (GAME.nextLabel || 'المهمة التالية') + ' ⟵') : 'تابع ⟵'}</button>`}`;
    if (lives <= 0) return setTimeout(() => end(false), 1800);
    $('#cont').onclick = () => { if (last) { idx++; next(); } else { sidx++; ask(); } };
    $('#fb').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  };
  const end = (won) => {
    stopTimer(); hud();
    const st = won ? Math.max(1, lives) : 0, rec = getRec(), isRec = score > rec; if (isRec) setRec(score);
    won ? S.win() : S.lose();
    const rows = Object.entries(miss).map(([k, n]) => `<tr><td>${GAME.cats[k][0]}</td><td>${m(n)}</td><td>${GAME.cats[k][1]}</td></tr>`);
    g.innerHTML = `<div class="card" style="text-align:center"><h1>${won ? GAME.winTitle : GAME.loseTitle}</h1>
      <div class="stars">${[0, 1, 2].map((i) => `<span class="${i < st ? '' : 'off'}">⭐</span>`).join('')}</div>
      <p>النقاط: <b class="m">${score}</b> ${isRec ? '· 🎉 رقم قياسي جديد!' : rec ? `· أفضل نتيجة: <b class="m">${rec}</b>` : ''}</p>
      ${won ? '' : '<p>لا بأس! راجع الأخطاء في الأسفل ثم حاول مرة أخرى.</p>'}
      ${rows.length ? `<table class="tbl" style="text-align:right"><tr><td><b>نوع الخطأ</b></td><td><b>العدد</b></td><td><b>تذكّر</b></td></tr>${rows.join('')}</table>` : '<p>✨ بلا أي خطأ في الفهم!</p>'}
      <div class="fb ok" style="text-align:right">📌 ${GAME.summary}</div>
      <button class="go" id="again">العب مرة أخرى 🔁</button></div>`;
    $('#again').onclick = intro;
  };
  intro();
})();

</script>

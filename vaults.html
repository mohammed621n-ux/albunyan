<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خزائن البنيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* غرفة خزائن: ثلاث خزائن (برونز، فضة، ذهب)، والجدول نفسه هو القفل */
  :root {
    --night: #0a1424; --steel: #16263f; --steel-2: #20365a; --edge: #35588f;
    --paper: #fbf6ee; --ink: #1b2742; --muted: #5d6b84;
    --orange: #f07a2a; --gold: #ffc247; --good: #1f9d55; --good-soft: #def5e7; --bad: #d23b2f; --bad-soft: #fde6e3;
    --blue: #1f6fd6; --laser: #ff3b30;
    --bronze: #cd7f32; --silver: #c0c7d2; --goldm: #f0b429;
    --f-ar: "Cairo", "Segoe UI", Tahoma, sans-serif;
    --f-m: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; font-family: var(--f-ar); color: #fff; direction: rtl; background: radial-gradient(ellipse at 50% -20%, #22406f, var(--night) 60%) fixed;
    padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .m { font-family: var(--f-m); direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-size: 1.1em; }
  .m i { font-style: italic; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--orange); }
  .who b { display: block; font-size: 16px; font-weight: 900; } .who span { font-size: 12px; color: var(--gold); font-weight: 800; }
  #sound { margin-inline-start: auto; font: inherit; font-size: 13px; color: #fff; background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 20px; padding: 4px 12px; cursor: pointer; }

  .map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .vt { border-radius: 14px; padding: 8px; text-align: center; background: var(--steel); border: 2px solid #ffffff1a; font-weight: 900; font-size: 13px; color: #9fb3cf; }
  .vt .ic { font-size: 26px; display: block; } .vt .st { display: block; letter-spacing: 2px; font-size: 14px; min-height: 20px; }
  .vt.now { border-color: var(--gold); color: #fff; box-shadow: 0 0 18px #ffc24755; } .vt.done { border-color: var(--good); color: #c9f5da; }

  .hud { display: flex; align-items: center; gap: 10px; background: #00000044; border: 1px solid #ffffff22; border-radius: 14px; padding: 8px 12px; }
  .hearts { font-size: 22px; letter-spacing: 3px; } .hearts .off { filter: grayscale(1); opacity: 0.25; }
  .lasers { flex: 1; height: 8px; border-radius: 4px; background: repeating-linear-gradient(90deg, #ff3b3055 0 10px, transparent 10px 18px); }
  .stepn { font-size: 13px; font-weight: 800; color: #cfe0ff; }

  .vault { position: relative; border-radius: 22px; padding: 14px; background: linear-gradient(160deg, var(--steel-2), var(--steel)); border: 3px solid var(--edge); box-shadow: inset 0 0 0 5px #0a1424, 0 14px 30px #0008; display: flex; flex-direction: column; gap: 12px; }
  .vault.bronze { border-color: var(--bronze); } .vault.silver { border-color: var(--silver); } .vault.gold { border-color: var(--goldm); }
  .vault.alarm { animation: alarm 0.35s 3; } @keyframes alarm { 50% { box-shadow: inset 0 0 0 5px var(--laser), 0 0 40px var(--laser); transform: translateX(-5px); } }
  .vh { display: flex; align-items: center; gap: 10px; }
  .vh h2 { margin: 0; font-size: 20px; font-weight: 900; } .vh .lv { font-size: 12px; font-weight: 900; border-radius: 8px; padding: 1px 10px; color: #0a1424; }
  .idea { background: #0a1424; border: 1px dashed #ffffff33; border-radius: 12px; padding: 8px 12px; font-size: 14.5px; line-height: 1.9; color: #dbe6f7; }
  .idea b { color: var(--gold); } .idea .m { color: #ffd27a; }

  .tblw { overflow-x: auto; }
  .tbl { direction: ltr; display: grid; gap: 6px; min-width: 300px; }
  .tc { min-height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--f-m); font-size: 22px; white-space: nowrap; transition: background 0.3s, box-shadow 0.3s, transform 0.2s; position: relative; }
  .tc i { font-style: italic; }
  .tc.corner { color: #9fb3cf; font-size: 26px; }
  .tc.hd { background: #0a1424; color: #fff; border: 2px solid #ffffff22; }
  .tc.hd.unk, .tc.rh.unk { color: var(--gold); border: 2px dashed var(--gold); background: transparent; }
  .tc.rh { background: var(--orange); color: #fff; }
  .tc.cell { background: #fbf6ee; color: var(--ink); border: 2px solid #dbe2ef; }
  .tc.cell.empty { background: #ffffff10; border: 2px dashed #ffffff33; color: transparent; }
  .tc.target { box-shadow: 0 0 0 4px var(--gold), 0 0 22px #ffc24788; animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 4px var(--gold), 0 0 6px #ffc24744; } }
  .tc.diag { background: #fff3c4 !important; border-color: var(--goldm) !important; color: var(--ink) !important; }
  .tc.fill { animation: pop 0.45s; } @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.12); } }
  .goal { text-align: center; font-size: 14.5px; color: #cfe0ff; } .goal .m { color: #ffd27a; font-size: 1.25em; }

  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card p { margin: 0; line-height: 1.85; font-size: 15.5px; } .card .m { color: var(--blue); }
  .q { font-weight: 900; font-size: 16.5px; line-height: 1.9; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { font: inherit; min-height: 58px; border-radius: 14px; border: 2px solid #c8d3e6; background: #fff; color: var(--ink); cursor: pointer; font-size: 20px; box-shadow: 0 4px 0 #c8d3e6; transition: transform 0.12s; }
  .tile .m { font-size: 22px; color: var(--ink); }
  .tile:hover:not([disabled]) { transform: translateY(-2px); border-color: var(--orange); }
  .tile:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 #c8d3e6; }
  .tile.ok { background: var(--good-soft); border-color: var(--good); } .tile.no { background: var(--bad-soft); border-color: var(--bad); animation: shake 0.35s; }
  .tile[disabled] { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .fb { border-radius: 12px; padding: 9px 12px; line-height: 1.85; font-size: 15px; }
  .fb.ok { background: var(--good-soft); border-inline-start: 5px solid var(--good); } .fb.no { background: var(--bad-soft); border-inline-start: 5px solid var(--bad); }
  .fb .m { color: var(--ink); }
  .btn { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer; background: var(--orange); color: #fff; box-shadow: 0 4px 0 #b9581a; align-self: flex-start; }
  .btn.big { font-size: 20px; padding: 15px 30px; align-self: center; } .btn.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid #d5dceb; }
  .tile:focus-visible, .btn:focus-visible, #sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .intro { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; background: linear-gradient(180deg, var(--steel-2), var(--steel)); border: 2px solid var(--edge); border-radius: 22px; padding: 18px 14px; }
  .intro h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); font-weight: 900; line-height: 1.1; } .intro h1 em { font-style: normal; color: var(--gold); }
  .intro p { margin: 0; color: #c9d6ee; line-height: 1.8; }
  .how { display: grid; gap: 8px; width: 100%; text-align: start; }
  .how div { background: #0a1424; border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.8; display: flex; gap: 10px; align-items: flex-start; }
  .how b.n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; }
  .warnbox { background: #3a0f0f; border: 2px solid var(--laser); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.8; width: 100%; text-align: start; }

  .safe { position: relative; width: min(300px, 78vw); aspect-ratio: 1 / 0.75; margin: 4px auto; perspective: 900px; }
  .safe .in { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: inset 0 0 30px #0007; color: #2b1d00; font-weight: 900; }
  .safe .in .m { font-size: 26px; color: #2b1d00; white-space: normal; text-align: center; }
  .safe .door { position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(160deg, #3a5f97, #13284a); border: 5px solid #5a7fb8; transform-origin: 0 50%; transition: transform 1.6s cubic-bezier(.5,0,.2,1); display: grid; place-items: center; }
  .safe .door::after { content: ""; width: 38%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #2e4f82 40%, #1a3360 41%, #1a3360 60%, #3a5f97 61%); border: 4px solid #8fb0e0; }
  .safe.open .door { transform: rotateY(-105deg); }
  .stars { font-size: 40px; letter-spacing: 6px; text-align: center; } .stars .off { filter: grayscale(1); opacity: 0.3; }
  .siren { position: fixed; inset: 0; z-index: 70; background: #3a0000e6; display: grid; place-items: center; padding: 20px; animation: sir 0.6s steps(2) 4; }
  @keyframes sir { 50% { background: #0a1424e6; } }
  .conf { position: fixed; top: -14px; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 60; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  footer { text-align: center; color: #8fa3c4; font-size: 12.5px; } footer a { color: inherit; }
  @media (max-width: 440px) { .tc { font-size: 19px; min-height: 52px; } .tile .m { font-size: 19px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const X = '<i>x</i>', H = '<i>h</i>(<i>x</i>)';
  const p = (n) => (n === 0 ? '' : n === 1 ? X : `${X}<sup>${n}</sup>`);
  const m = (t) => `<span class="m">${t}</span>`;
  // حد: معامل × x^n
  const term = (c, n) => { const a = Math.abs(c), s = c < 0 ? '−' : ''; if (n === 0) return s + a; return s + (a === 1 ? '' : a) + p(n); };

  // الأصوات
  let ac = null, soundOn = true;
  const tone = (seq, type = 'triangle', vol = 0.1) => { if (!soundOn) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); let t = ac.currentTime; seq.forEach(([f, d]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); t += d * 0.85; }); } catch (e) {} };
  const clunk = () => tone([[160, 0.12], [90, 0.2]], 'square', 0.08);
  const good = () => tone([[660, 0.1], [990, 0.16]]);
  const siren = () => tone([[880, 0.16], [620, 0.16], [880, 0.16], [620, 0.16]], 'sawtooth', 0.06);
  const opened = () => tone([[392, 0.14], [523, 0.14], [659, 0.14], [784, 0.3]]);
  $('#sound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 بلا صوت'; e.currentTarget.setAttribute('aria-pressed', soundOn); });
  const confetti = (n = 70) => { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cols = ['#ffc247', '#1f9d55', '#f07a2a', '#fff', '#60a5fa']; for (let k = 0; k < n; k++) { const d = document.createElement('div'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[k % cols.length]; d.style.animationDuration = 1.5 + Math.random() * 1.6 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 3600); } };

  const V = [
    { key: 'bronze', name: 'الخزانة البرونزية', ic: '🥉', col: 'var(--bronze)',
      idea: `<b>الفكرة:</b> الجدول طريقة <b>للضرب</b>. نضرب ${m(`(${X} + 2)`)} في ${m(`(${X}<sup>2</sup> + 3${X} + 1)`)}: كل خانة = حد صفها × حد عمودها، ثم نجمع الحدود المتشابهة.`,

  let v = 0, s = 0, hearts = 3, miss = 0, stars = [0, 0, 0], alarmed = false;
